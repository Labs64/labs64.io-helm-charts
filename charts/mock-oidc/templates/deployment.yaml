apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oidc
  labels:
    {{- include "mock-oidc.labels" . | nindent 4 }}
  annotations:
    labs64.io/warning: "DEV ONLY - mock OIDC provider; never deploy outside local environments"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mock-oidc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mock-oidc.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mock-oauth2-server
          image: {{ include "mock-oidc.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JSON_CONFIG_PATH
              value: /config/config.json
          # The discovery document is the honest readiness signal: it only answers
          # once the server has parsed the persona config it is mounted with.
          livenessProbe:
            httpGet:
              path: {{ .Values.gateway.pathPrefix }}/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.gateway.pathPrefix }}/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: mock-oidc-config
