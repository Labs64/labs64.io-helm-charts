{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-oidc
  labels:
    {{- include "mock-oidc.labels" . | nindent 4 }}
  annotations:
    labs64.io/warning: "DEV ONLY - mock OIDC provider; never deploy outside local environments"
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # No filter/rewrite: mock-oauth2-server already serves its endpoints under
    # the issuer id, which pathPrefix mirrors.
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.pathPrefix | quote }}
      backendRefs:
        - name: mock-oidc
          port: {{ .Values.service.port }}
{{- end }}
