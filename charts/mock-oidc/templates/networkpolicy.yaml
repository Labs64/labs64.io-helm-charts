{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mock-oidc
  labels:
    {{- include "mock-oidc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mock-oidc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # From the Gateway (so a demo user can mint a token from outside) and from
    # anything in this namespace (the auth proxy fetching the discovery document
    # and the JWKS).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS only. This server calls nothing — it signs tokens from a static config
    # mounted at startup — so anything wider would be egress it never uses.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
