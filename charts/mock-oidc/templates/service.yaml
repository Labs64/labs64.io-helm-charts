apiVersion: v1
kind: Service
metadata:
  name: mock-oidc
  labels:
    {{- include "mock-oidc.labels" . | nindent 4 }}
  annotations:
    labs64.io/warning: "DEV ONLY - mock OIDC provider; never deploy outside local environments"
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mock-oidc.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
