enabled: true

# -- Connectivity checks to run; enable only what your modules need.
checks:
  # -- AMQP broker reachability (TCP connect)
  rabbitmq:
    enabled: false
    host: rabbitmq.infra.example.com
    port: 5672
  # -- PostgreSQL connectivity and login (SELECT 1)
  postgresql:
    enabled: false
    host: postgres.infra.example.com
    port: 5432
    database: postgres
    username: ""
    password: ""
    # -- Existing Secret with `username`/`password` keys — preferred over the inline values
    # above, which land in the pod spec in plaintext (readable by anyone with `get pods`).
    existingSecret: ""
  # -- Redis connectivity (PING)
  redis:
    enabled: false
    host: redis.infra.example.com
    port: 6379
    password: ""
    # -- Existing Secret with a `password` key (passed via REDISCLI_AUTH, never argv/pod spec).
    existingSecret: ""
  # -- OIDC discovery + client_credentials token grant
  oidc:
    enabled: false
    discoveryUrl: https://idp.example.com/realms/example/.well-known/openid-configuration
    clientId: ""
    clientSecret: ""
    # -- Existing Secret with `client-id`/`client-secret` keys — preferred over inline values.
    existingSecret: ""
    scope: ""

# -- Images used by the check containers
images:
  busybox: busybox:1.36
  # -- Official images rather than bitnamilegacy/*, which is an unsupported
  # namespace on a deprecation path. These run the same SELECT 1 / PING checks;
  # both put psql / redis-cli on PATH, which is all job.yaml relies on.
  postgresql: postgres:18-alpine
  # redis-cli speaks RESP, so it works unchanged against Valkey (AWS ElastiCache, local dev).
  redis: redis:8-alpine
  curl: curlimages/curl:8.10.1
