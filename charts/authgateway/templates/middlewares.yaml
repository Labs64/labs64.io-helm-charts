# `-auth` is what every module route references (gateway.sharedMiddlewares.auth). It is a
# chain, in this order: ForwardAuth first (it needs the caller's bearer token to decide),
# then removal of `Authorization`, so a module only ever sees the trusted X-Auth-* identity
# headers (RFC_03 Principle 1: modules never see the JWT). A native Gateway API filter cannot
# do this: native filters run before ExtensionRef filters, i.e. before ForwardAuth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "chart-libs.fullname" . }}-auth
  labels:
    {{- include "chart-libs.labels" . | nindent 4 }}
spec:
  chain:
    middlewares:
      - name: {{ include "chart-libs.fullname" . }}-forwardauth
      - name: {{ include "chart-libs.fullname" . }}-strip-authorization
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "chart-libs.fullname" . }}-forwardauth
  labels:
    {{- include "chart-libs.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ .Values.authGateway.address | default (printf "http://%s.%s.svc.cluster.local:%v/auth" .Values.authGateway.serviceName .Release.Namespace .Values.authGateway.port) | quote }}
    trustForwardHeader: {{ .Values.authGateway.trustForwardHeader }}
    maxResponseBodySize: {{ .Values.authGateway.maxResponseBodySize }}
    authResponseHeaders:
      {{- toYaml .Values.authGateway.authResponseHeaders | nindent 6 }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "chart-libs.fullname" . }}-strip-authorization
  labels:
    {{- include "chart-libs.labels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      # An empty value deletes the header before the request reaches the module.
      Authorization: ""
---
# NOTE: inbound X-Auth-* stripping is now a native Gateway API RequestHeaderModifier
# filter emitted first in every route by chart-libs.gateway-routes (spec §3.2). The
# former authgateway-strip-auth-headers Middleware was removed 2026-07-12 after the
# live ordering gate proved the native filter runs before the ExtensionRef ForwardAuth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "chart-libs.fullname" . }}-ratelimit
  labels:
    {{- include "chart-libs.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.rateLimit.average }}
    burst: {{ .Values.rateLimit.burst }}
    {{- if .Values.rateLimit.global }}
    sourceCriterion:
      requestHost: true
    {{- else if .Values.rateLimit.perUser }}
    sourceCriterion:
      requestHeaderName: X-Auth-User
    {{- end }}
{{- if .Values.buffering.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "chart-libs.fullname" . }}-buffering
  labels:
    {{- include "chart-libs.labels" . | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ .Values.buffering.maxRequestBodyBytes }}
{{- end }}
{{- if .Values.compress.enabled }}
---
# Response compression at the edge — a safe, universal frontstore optimization for
# all Labs64.IO modules routed through Traefik. Referenced by chart-libs.gateway-routes
# when a module sets gateway.sharedMiddlewares.compress.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "chart-libs.fullname" . }}-compress
  labels:
    {{- include "chart-libs.labels" . | nindent 4 }}
spec:
  compress:
    {{- with .Values.compress.excludedContentTypes }}
    excludedContentTypes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    minResponseBodyBytes: {{ .Values.compress.minResponseBodyBytes | default 1024 }}
{{- end }}
