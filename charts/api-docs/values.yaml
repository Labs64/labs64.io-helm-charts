enabled: true

externalSecrets:
  enabled: false
  storeName: local-kubernetes-store
  # -- Key/path of this module's secret in the external backend; every key becomes an env var. Defaults to the release fullname.
  secretKey: ""
# -- Global values shared across Labs64.IO charts
# @schema
# type: object
# additionalProperties: true
# @schema
global:
  # -- Base domain; swagger-ui is exposed as gateway.<domain>
  domain: localhost

# -- This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# -- This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: swaggerapi/swagger-ui
  # -- This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # -- Pin the image by digest (`sha256:<64 hex>`). Takes precedence over `tag` — the release pipeline sets it so a deployment cannot follow a moved tag.
  digest: ""

# -- This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# -- Secret data to be used as environment variables (delivered via envFrom)
secrets:
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  data: {}

# -- This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# -- This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials? swagger-ui is a static site and
  # never calls the Kubernetes API.
  automount: false
  # -- Annotations to add to the service account (e.g. `eks.amazonaws.com/role-arn` for IRSA)
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# RBAC configuration (create RBAC resources: Role, RoleBinding)
# Nothing in this chart reads the K8s API (static swagger-ui) — no Role, no rules.
rbac:
  create: false
  rules: []

# -- This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# -- This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  runAsNonRoot: true
  runAsUser: 1064
  runAsGroup: 1064
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  # swagger-ui's docker-entrypoint.d scripts rewrite files at every start: the docroot
  # (swagger-initializer.js, the .gz copies), /etc/nginx/conf.d and /etc/nginx/templates (envsubst,
  # CORS/embedding toggles), plus nginx's /var/cache/nginx, /run (pid) and /tmp. Each is an emptyDir
  # (`volumes` below); the image's own content is copied into them first by `initContainers`.
  readOnlyRootFilesystem: true

# -- This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # -- This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # -- This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# -- Gateway API HTTPRoute for swagger-ui (public docs aggregator; module API
# routes are owned by the module charts). No auth — faithful to prior behavior.
gateway:
  # -- Enable the swagger-ui HTTPRoute
  enabled: true
  # -- Gateway(s) this HTTPRoute attaches to
  parentRefs:
    - name: labs64io-gateway
      namespace: tools
  # -- Routes. Each: path, optional pathType (default PathPrefix), service{name,port};
  # stripPrefix strips the matched prefix; redirectTo issues a 302 to a fixed path.
  # @schema
  # type: array
  # items:
  #   type: object
  #   additionalProperties: true
  # @schema
  routes:
    - path: /swagger-ui
      stripPrefix: true
    - path: /
      pathType: Exact
      redirectTo: /swagger-ui/

# Sized off observed steady-state usage (~1m CPU / 3Mi mem on a small EKS development cluster — a static Swagger UI
# behind nginx) with headroom for burst. The chart's original 100m/512Mi request was ~170x actual
# memory use.
resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 20m
    memory: 32Mi

# -- This is to setup the liveness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 2

# -- This is to setup the readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3
  timeoutSeconds: 2

# -- This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# -- Additional volumes on the output Deployment definition. Mounts the swagger-config
# ConfigMap (rendered from `swaggerUI` below) into the image's webroot so CONFIG_URL (see
# `env` below) can serve it — without this, the container falls back to its baked-in
# petstore.swagger.io demo config and the ConfigMap is never actually consumed.
volumes:
  - name: swagger-config
    configMap:
      name: '{{ include "chart-libs.fullname" . }}-swagger-config'
  # Writable paths for the read-only root filesystem (see securityContext above).
  - name: html
    emptyDir: {}
  - name: nginx-conf
    emptyDir: {}
  - name: nginx-templates
    emptyDir: {}
  - name: nginx-cache
    emptyDir: {}
  - name: run
    emptyDir: {}
  - name: tmp
    emptyDir: {}

# -- Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: html
    mountPath: /usr/share/nginx/html
  - name: swagger-config
    mountPath: /usr/share/nginx/html/swagger-config.yaml
    subPath: swagger-config.yaml
    readOnly: true
  - name: nginx-conf
    mountPath: /etc/nginx/conf.d
  - name: nginx-templates
    mountPath: /etc/nginx/templates
  - name: nginx-cache
    mountPath: /var/cache/nginx
  - name: run
    mountPath: /run
  - name: tmp
    mountPath: /tmp

# -- Init containers (a template string, rendered with `tpl`). The default copies the image's
# docroot and nginx config into the writable emptyDirs above, so the read-only root filesystem
# still starts with the content swagger-ui ships.
initContainers: |
  - name: stage-writable-paths
    image: {{ include "chart-libs.image" (dict "imageRoot" .Values.image "context" $) | quote }}
    imagePullPolicy: {{ .Values.image.pullPolicy }}
    command:
      - sh
      - -c
      - cp -a /usr/share/nginx/html/. /stage/html/ && cp -a /etc/nginx/conf.d/. /stage/conf.d/ && cp -a /etc/nginx/templates/. /stage/templates/
    securityContext:
      {{- toYaml .Values.securityContext | nindent 4 }}
    resources:
      {{- toYaml .Values.resources | nindent 4 }}
    volumeMounts:
      - name: html
        mountPath: /stage/html
      - name: nginx-conf
        mountPath: /stage/conf.d
      - name: nginx-templates
        mountPath: /stage/templates

nodeSelector: {}

tolerations: []

affinity: {}

# -- Constrain how replicas spread across nodes/zones (e.g. maxSkew/topologyKey/whenUnsatisfiable).
# labelSelector defaults to this chart's own selector labels when a constraint omits one.
topologySpreadConstraints: []

# -- CONFIG_URL tells the swagger-ui image's configurator script (/docker-entrypoint.d/40-swagger-ui.sh)
# to fetch this path client-side (browser-side, not container-side) for its full config
# (dom_id/urls/validatorUrl), instead of using its built-in petstore.swagger.io demo. Deliberately
# relative (no leading slash): the page is only reachable behind the gateway's /swagger-ui prefix,
# which the HTTPRoute strips before forwarding — a root-absolute "/swagger-config.yaml" would miss
# that route entirely (404 at the gateway, never reaching this container). Must stay in sync with
# the volumeMount path above.
env:
  - name: CONFIG_URL
    value: swagger-config.yaml
envFrom: []

# -- Templates (under templates/, without .yaml) whose rendered content is hashed into a pod
# annotation, so a change rolls the pods. The Swagger config is mounted with subPath, which never
# receives live updates: without this a changed URL list would wait for the next unrelated restart.
extraConfigChecksums:
  - configmap-swagger-config

# -- Swagger UI configuration (ref: https://swagger.io/docs/open-source-tools/swagger-ui/usage/configuration/)
# -- API definitions shown in the Swagger UI's selector, keyed by module and listed in key order
# after any `swaggerUI.urls`. Each: `name`, `url` (both rendered with `tpl`) and optional `enabled`
# (default true). A map, unlike `swaggerUI.urls`, so a later values layer can switch one entry off,
# for instance for a module that is not installed, without restating the whole list.
# @schema
# type: object
# additionalProperties:
#   type: object
#   properties:
#     name:
#       type: string
#     url:
#       type: string
#     enabled:
#       type: boolean
#   required: [name, url]
# @schema
apiDefinitions: {}

swaggerUI:
  # -- An array of API definition objects used by Topbar plugin. When used and Topbar plugin is enabled, the url parameter will not be parsed. Names and URLs must be unique among all items in this array, since they’re used as identifiers.
  urls: []
  # -- The ID of a DOM element inside which SwaggerUI will put its user interface.
  dom_id: '#swagger-ui'
  # -- By default, Swagger UI attempts to validate specs against swagger.io’s online validator. You can use this parameter to set a different validator URL, for example for locally deployed validators. Setting it to either none, 127.0.0.1 or localhost will disable validation.
  validatorUrl: https://validator.swagger.io/validator

# -- NetworkPolicy: allow ingress from Traefik and same-namespace pods only (rendered by chart-libs.networkpolicy)
networkPolicy:
  enabled: false
  # -- Namespace where Traefik runs
  gatewayNamespace: tools
  # -- Ingress controller pod-selector labels; defaults to the internal Traefik standard
  # (app.kubernetes.io/name: traefik) when empty
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  ingressControllerLabels: {}
  # -- TCP ports open to the ingress controller and the in-namespace callers below.
  ingressPorts:
    - 8080
  # -- In-namespace workloads (app.kubernetes.io/name) allowed to call those ports, besides the
  # ingress controller and this chart's own pods (helm test). `[]`: only the gateway serves it. Remove the key
  # (set it to null) to fall back to the namespace-wide rule.
  # @schema
  # type: array
  # items:
  #   type: string
  # @schema
  ingressFrom: []
  # -- Deployment-owned callers appended to `ingressFrom` without restating it (the umbrella chart
  # adds its own helm test pod here).
  # @schema
  # type: array
  # items:
  #   type: string
  # @schema
  extraIngressFrom: []
  # -- Namespace the observability/OTel collector runs in
  observabilityNamespace: monitoring
  # -- Additional raw ingress rules
  extraIngress: []

# -- Values passed to the chart-libs library dependency (present so the generated schema accepts the key Helm injects for the dependency)
# @schema
# type: object
# additionalProperties: true
# @schema
chart-libs: {}
