{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chart-libs.fullname" . }}
  labels:
    {{- include "chart-libs.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  {{- /* Omitted when global.gateway.anyHost is set: a route reached by raw IP or a
         port-forward has no domain to derive a hostname from, and a hostname-scoped
         HTTPRoute 404s every such request. Same rule as chart-libs.gateway-routes. */}}
  {{- if not (and .Values.global .Values.global.gateway .Values.global.gateway.anyHost) }}
  hostnames:
    - {{ include "chart-libs.gatewayHost" . | quote }}
  {{- end }}
  rules:
    {{- range $route := .Values.gateway.routes }}
    - matches:
        - path:
            type: {{ $route.pathType | default "PathPrefix" }}
            value: {{ $route.path | quote }}
      filters:
        {{- /* Root convenience redirect: 302 to a fixed path (native RequestRedirect). */}}
        {{- if $route.redirectTo }}
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ $route.redirectTo | quote }}
            statusCode: 302
        {{- end }}
        {{- /* Strip the matched prefix before forwarding (native URLRewrite). */}}
        {{- if $route.stripPrefix }}
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        {{- end }}
      {{- if not $route.redirectTo }}
      backendRefs:
        - name: {{ if $route.service }}{{ $route.service.name | default (include "chart-libs.fullname" $) }}{{ else }}{{ include "chart-libs.fullname" $ }}{{ end }}
          port: {{ if $route.service }}{{ $route.service.port | default $.Values.service.port }}{{ else }}{{ $.Values.service.port }}{{ end }}
      {{- end }}
    {{- end }}
{{- end }}
