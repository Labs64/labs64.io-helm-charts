# Labs64.IO Ecosystem Umbrella Chart Configuration

# Sub-charts Toggles
# @schema
# type: object
# additionalProperties: true
# @schema
api-gateway:
  enabled: true
  # Leave oidc.discoveryUrl unset to use the chart default (Keycloak). It is not set
  # here because the mock-oidc Service resolves as mock-oidc.<namespace>.svc.cluster.local
  # and the namespace is not knowable at chart-authoring time — install.sh sets it
  # explicitly for demo installs.
# @schema
# type: object
# additionalProperties: true
# @schema
authz-pdp:
  enabled: true
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Not GA. The labs64/checkout and labs64/checkout-ui images have never been
# published (both repositories 404 on Docker Hub), so enabling this yields
# ImagePullBackOff. Toggle retained for when they are.
checkout:
  enabled: false
  # See payment-gateway.migrationJob above.
  migrationJob:
    enabled: false
# @schema
# type: object
# additionalProperties: true
# @schema
payment-gateway:
  enabled: true
  # The bundled PostgreSQL above creates this database at initdb; the app runs its
  # own Flyway. See the migrationJob comment in charts/payment-gateway/values.yaml.
  migrationJob:
    enabled: false
# @schema
# type: object
# additionalProperties: true
# @schema
auditflow:
  enabled: true
# @schema
# type: object
# additionalProperties: true
# @schema
api-docs:
  enabled: true
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Not GA. labs64/customer-portal-ui publishes no tags. Enable only once you have
# a published customer-portal-ui image.
customer-portal:
  enabled: false

# Global Configuration Shared Across Ecosystem
# @schema
# type: object
# additionalProperties: true
# @schema
global:
  # -- Required by the bitnamilegacy image override under `rabbitmq` below: the
  # Bitnami charts refuse a repository they do not recognise as official unless
  # this is set.
  security:
    allowInsecureImages: true

  sharedConfig:
    enabled: true
    name: "labs64io-shared-config"
  sharedSecret:
    enabled: true
    name: "labs64io-shared-secret"
  
  # External dependencies. Plain, fixed hostnames — the bundled Bitnami subcharts below are
  # pinned to matching `fullnameOverride`s, so these never need release-name templating (a
  # `{{ .Release.Name }}-postgresql`-style string here would need a second `tpl` pass wherever
  # it's consumed, which is exactly the class of bug this fixed-naming setup avoids).
  postgresql:
    host: "labs64io-postgresql"
    port: 5432
    username: "labs64"
    database: "labs64io"
  rabbitmq:
    host: "labs64io-rabbitmq"
    port: 5672
    username: "labs64"
  redis:
    host: "labs64io-redis-master"
    port: 6379

# -- Demo mode. Permits the dev-grade default passwords below and unlocks the
# dev-only mock-oidc subchart. MUST be false for any real deployment: with it
# false, the chart refuses to render while any password is still at its default.
demoMode: false

secrets:
  # -- Convenience aliases for the three bundled-infra passwords, injected into
  # labs64io-shared-secret. The shipped values are dev defaults — with
  # `demoMode: false` (the default) the chart fails to render until they change.
  postgresqlPassword: "labs64_dev_password"
  # -- See `secrets.postgresqlPassword`.
  rabbitmqPassword: "labs64_dev_password"
  # -- See `secrets.postgresqlPassword`.
  redisPassword: "labs64_dev_password"
  # -- Additional key/value pairs merged into the shared Secret verbatim. Same shape
  # as every module chart's `secrets.data`, so one caller code path covers both.
  # Keys here win over the aliases above on collision.
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  data: {}

# Opt-In Infrastructure (Enabled by default for one-click dev deployments)
# @schema
# type: object
# additionalProperties: true
# @schema
postgresql:
  enabled: true
  # -- Pinned so `global.postgresql.host` above can be a plain string (standalone
  # architecture: no "-primary" suffix on the resulting service name)
  fullnameOverride: "labs64io-postgresql"
  # TODO: pin this image. The subchart defaults to `latest`, which pulls today but is
  # mutable: a re-pull can move the PostgreSQL MAJOR version under an existing PVC, and
  # PostgreSQL refuses to start on a data directory written by a different major — a
  # routine pod restart that presents as data loss. There is currently no tag to pin to:
  # docker.io/bitnami/postgresql carries only `latest`, and bitnamilegacy/postgresql
  # stops at 17.6.0 while this subchart (18.7.11) targets appVersion 18.4.0. Pin by
  # digest, or move to oci://registry-1.docker.io/bitnamicharts, once one is available.
  # -- Each module owns its own database (db-per-service isolation — see the note on
  # global.postgresql above). The Bitnami chart creates only `auth.database`, and the
  # modules' own pre-install migration Jobs cannot create the rest: they run before
  # this server exists. Creating them here, at first initdb, is the only point in the
  # release where the ordering works. Runs once, on an empty data directory only —
  # enabling a module later needs the database created by hand.
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  primary:
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    initdb:
      # @schema
      # type: object
      # additionalProperties: true
      # @schema
      scripts:
        00-labs64io-databases.sql: |
          SELECT 'CREATE DATABASE payment_gateway'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'payment_gateway')\gexec
          SELECT 'CREATE DATABASE checkout'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'checkout')\gexec
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  auth:
    username: "labs64"
    database: "labs64io"
    existingSecret: "labs64io-shared-secret"
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    secretKeys:
      adminPasswordKey: "SPRING_DATASOURCE_PASSWORD"
      userPasswordKey: "SPRING_DATASOURCE_PASSWORD"

# @schema
# type: object
# additionalProperties: true
# @schema
rabbitmq:
  enabled: true
  # -- Pinned so `global.rabbitmq.host` above can be a plain string
  fullnameOverride: "labs64io-rabbitmq"
  # -- docker.io/bitnami/rabbitmq:4.1.3-debian-12-r1 (the subchart default) returns
  # 404: since 2025-08-28 the Bitnami free tier carries only rolling tags, and this
  # is the one bundled subchart that pins a versioned one. The versioned image lives
  # in bitnamilegacy/*, which needs global.security.allowInsecureImages above. Same
  # fix as overrides/rabbitmq/values.local.yaml and charts/preflight.
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  auth:
    username: "labs64"
    existingPasswordSecret: "labs64io-shared-secret"
    existingSecretPasswordKey: "SPRING_RABBITMQ_PASSWORD"

# @schema
# type: object
# additionalProperties: true
# @schema
redis:
  enabled: true
  # TODO: pin this image — see the note under `postgresql` above. Same situation:
  # docker.io/bitnami/redis carries only `latest` and bitnamilegacy/redis stops at
  # 8.2.1 while this subchart (27.0.13) targets appVersion 8.8.0. Lower stakes than
  # PostgreSQL (no on-disk major-version barrier), but still mutable.
  architecture: standalone
  # -- Pinned so `global.redis.host` above can be a plain string (standalone architecture:
  # the primary/master service is named "<fullnameOverride>-master")
  fullnameOverride: "labs64io-redis"
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  auth:
    existingSecret: "labs64io-shared-secret"
    existingSecretPasswordKey: "SPRING_DATA_REDIS_PASSWORD"

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Opt-in Gateway. Without a GatewayClass and a Gateway named labs64io-gateway,
# every module's HTTPRoute renders but sits Accepted:False and receives no traffic
# — pods running, nothing to curl. Enable this, or provision an equivalent Gateway
# yourself (see "Gateway API setup" in the chart repo's README).
#
# The Gateway API CRDs are deliberately NOT bundled: Helm never upgrades CRDs from a
# chart's crds/ after first install. Apply them separately (`just install-crds`, or
# install.sh, which does it with `kubectl apply --server-side`).
traefik:
  enabled: false
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  providers:
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    kubernetesGateway:
      enabled: true
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  gatewayClass:
    enabled: true
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  gateway:
    enabled: true
    name: labs64io-gateway
    namespace: tools
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    listeners:
      # @schema
      # type: object
      # additionalProperties: true
      # @schema
      web:
        port: 8000
        protocol: HTTP
        # @schema
        # type: object
        # additionalProperties: true
        # @schema
        namespacePolicy:
          # Modules install into their own namespace; the listener must accept
          # routes from it.
          from: All

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Dev-only OIDC provider. Requires demoMode=true — the chart refuses to render
# otherwise. Issues tokens to anyone who asks and authenticates nobody; never
# enable it outside a throwaway demo.
mock-oidc:
  enabled: false

# -- `helm test` probes each enabled module's health endpoint through its Service.
# Paths and ports mirror each chart's own readinessProbe, so a passing test means
# the same thing Kubernetes means by "ready".
tests:
  enabled: true
  # -- Per-probe timeout (seconds)
  timeoutSeconds: 10
  # -- Image used to run the probes. Needs only a shell and wget.
  image: busybox:1.36

