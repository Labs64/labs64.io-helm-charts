# Demo / evaluation profile. Everything bundled, nothing external required.
#
#   helm install labs64io labs64io/labs64io-ecosystem -f values.demo.yaml
#
# NOT for production: demoMode permits the shipped default passwords and enables
# mock-oidc, which authenticates nobody and signs whatever scopes it is asked for.
demoMode: true

# No domain to derive route hostnames from on a demo cluster reached by IP or a
# port-forward, so routes must match any Host header.
global:
  gateway:
    anyHost: true

api-gateway:
  enabled: true
authz-pdp:
  enabled: true
api-docs:
  enabled: true
# gateway.enabled defaults to false on these two; without it their APIs render no
# HTTPRoute at all and the install has nothing to call.
# mock-oidc's demo personas all stamp tenant "t_mock". The chart ships only the
# reserved `platform` tenant, so without this an authenticated demo call reaches
# auditflow and is rejected 403 for an unknown tenant — auth working, nothing
# publishable. A logging sink keeps the demo self-contained (events land in the
# sink container's log, no external store to configure).
auditflow:
  enabled: true
  gateway:
    enabled: true
  tenants:
    additional:
      - tenantId: t_mock
        enabled: true
        rateLimitPerSec: 200
        burst: 400
        pipelines:
          - name: demo-logging
            enabled: true
            sink:
              name: logging_sink
              properties:
                log-level: INFO

payment-gateway:
  enabled: true
  gateway:
    enabled: true
# Not GA — their images have never been published.
checkout:
  enabled: false
customer-portal:
  enabled: false

postgresql:
  enabled: true
rabbitmq:
  enabled: true
redis:
  enabled: true

# Without these two a demo install has nothing to curl and nothing to
# authenticate against.
traefik:
  enabled: true
mock-oidc:
  enabled: true
