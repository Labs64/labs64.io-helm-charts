# AWS reference profile: EKS with managed data stores.
#
# Data stores are AWS-managed — RDS PostgreSQL and ElastiCache Valkey per module, one Amazon MQ
# (RabbitMQ) broker — and credentials come from AWS Secrets Manager through External Secrets
# Operator (>= 0.16, external-secrets.io/v1). Provisioning them is the operator's job; this file
# only tells the chart that they exist.
#
# This file holds what is true for every environment of this shape. You supply the
# environment-specific coordinates in a second values file, passed last:
#
#   global.domain                                   public base domain (routes use gateway.<domain>)
#   <module>.enabled                                which modules this environment runs
#   <module>.applicationYaml                        data-store hosts and ports
#   <module>.externalSecrets.secretKey              the Secrets Manager entry of each module
#   <module>.serviceAccount.annotations             the IRSA role, where a module needs AWS APIs
#   <module>.networkPolicy.extraEgress              your VPC CIDR on the data-store ports
#   auditflow.tenants                               the environment's tenants, quotas and pipelines
#
#   helm upgrade --install labs64io labs64io/labs64io-ecosystem -n labs64io \
#     -f values.aws.yaml -f <your-environment-values>.yaml
#
# The gateway (Traefik) is a separate release in the tools namespace, installed first:
# overrides/traefik/values.aws.yaml.
#
# Throwaway smoke test with demo identity (mock-oidc) — demo first, so this file wins:
#
#   ... -f values.demo.yaml -f values.aws.yaml -f <your-environment-values>.yaml

global:
  # Each module gets its own data-store coordinates (see the generated values). The shared
  # ConfigMap would export SPRING_*_HOST env vars for everyone, and env vars take precedence over
  # application.yaml, silently pointing every module at the same host.
  sharedConfig:
    enabled: false
  # Credentials come from each module's ExternalSecret instead of one shared Secret.
  sharedSecret:
    enabled: false

# Nothing renders these once the bundled infrastructure and the shared Secret are off; cleared so
# the default-password guard does not trip outside demoMode.
secrets:
  postgresqlPassword: ""
  rabbitmqPassword: ""
  redisPassword: ""

postgresql:
  enabled: false
rabbitmq:
  enabled: false
redis:
  enabled: false

traefik:
  # Not part of this release on AWS. The gateway is the only pod the public edge reaches, so it does
  # not run in the modules' namespace or share their release: install the upstream
  # chart as its own release in the tools namespace (values in
  # overrides/traefik/values.aws.yaml), before this chart. That release owns the GatewayClass and the
  # labs64io-gateway the module routes attach to (gateway.parentRefs: labs64io-gateway in tools).
  enabled: false

# Data-store egress (`networkPolicy.extraEgress`) is VPC-CIDR-scoped and supplied per environment
# — it needs each environment's actual VPC CIDR, which differs per environment and so can't live
# in this shared file. `networkPolicy.enabled` is what's true everywhere and belongs here.
#
# api-gateway/api-docs/authz-pdp aren't in this list yet: they don't talk to a data store
# directly, but their exact egress needs (e.g. a real external IdP once Keycloak lands) haven't
# been characterized against a default-deny policy — see the README's Known gaps.
#
# HPA + PDB + topologySpreadConstraints, every module below: chart defaults ship all three
# absent/disabled (fixed replicaCount, no scale-out, no anti-collocation — the default spread
# behaviour is the soft ScheduleAnyway, which does not stop both replicas of a module landing on
# the same node). minReplicas: 2 is what actually buys availability during a drain or a SPOT
# interruption; the hard DoNotSchedule spread constraint is what actually keeps the two replicas
# on different nodes so that availability isn't accidental — a PDB alone on an unchanged
# 1-replica Deployment just blocks the drain rather than surviving it, and a soft spread
# preference can still be violated under pressure. DoNotSchedule is safe now that Cluster
# Autoscaler is running: if the constraint can't be satisfied on current capacity, the pending
# pod triggers a scale-up rather than sitting stuck forever. maxReplicas/
# targetCPUUtilizationPercentage are left at chart defaults (3 / 80%).
api-gateway:
  autoscaling:
    enabled: true
    minReplicas: 2
  # podDisruptionBudget already enabled by chart default (replicaCount: 2 already, unlike the
  # modules below) — nothing to add here.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

api-docs:
  # Off on AWS: the public edge routes no docs path, so it would run replicas no one can reach.
  # Switch it on together with a route; the settings below then apply as they are.
  enabled: false
  autoscaling:
    enabled: true
    minReplicas: 2
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

auditflow:
  # Publish the AuditFlow route (POST /auditflow/api/v1/audit/publish behind ForwardAuth) on the
  # gateway. The route host is gateway.<global.domain>; your environment values set global.domain.
  gateway:
    enabled: true
  # Tenants are provisioned with the release: the backend may read
  # their credential Secrets by name and no other Secret of the namespace.
  rbac:
    tenantSecretsOnly: true
  networkPolicy:
    enabled: true
  externalSecrets:
    enabled: true
    storeName: aws-secretsmanager-cluster
  applicationYaml:
    spring:
      rabbitmq:
        ssl:
          # Amazon MQ accepts AMQPS (TLS, 5671) only.
          enabled: true
      data:
        redis:
          ssl:
            # ElastiCache in-transit encryption is mandatory.
            enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

payment-gateway:
  networkPolicy:
    enabled: true
  # The database exists before the release (RDS), so the pre-install migration Job can run.
  migrationJob:
    enabled: true
  externalSecrets:
    enabled: true
    storeName: aws-secretsmanager-cluster
  applicationYaml:
    spring:
      data:
        redis:
          ssl:
            enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

checkout:
  networkPolicy:
    enabled: true
  migrationJob:
    enabled: true
  externalSecrets:
    enabled: true
    storeName: aws-secretsmanager-cluster
  applicationYaml:
    spring:
      rabbitmq:
        ssl:
          enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

# No hpa.yaml in this chart (not built to scale) and it already ships podDisruptionBudget.
# enabled: true / replicaCount: 2 by default — only the spread constraint is missing.
authz-pdp:
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
