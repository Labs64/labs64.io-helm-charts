# AWS managed-services profile.
#
# Data stores are AWS-managed — RDS PostgreSQL and ElastiCache Valkey per module, one Amazon MQ
# (RabbitMQ) broker — and credentials come from AWS Secrets Manager through External Secrets
# Operator (>= 0.16, external-secrets.io/v1). All of it is provisioned by labs64.io-devops.
#
# This file holds only what is true for every AWS environment. Environment-specific coordinates
# (hosts, Secrets Manager keys, IRSA role ARNs) are rendered from Terraform outputs by
# labs64.io-devops (`just helm-values <env>`) and passed as the last values file:
#
#   helm upgrade --install labs64io labs64io/labs64io-ecosystem -n labs64io \
#     -f values.aws.yaml -f <generated-values>.yaml
#
# Throwaway smoke test with demo identity (mock-oidc) — demo first, so this file wins:
#
#   ... -f values.demo.yaml -f values.aws.yaml -f <generated-values>.yaml

global:
  # Each module gets its own data-store coordinates (see the generated values). The shared
  # ConfigMap would export SPRING_*_HOST env vars for everyone, and env vars take precedence over
  # application.yaml, silently pointing every module at the same host.
  sharedConfig:
    enabled: false
  # Credentials come from each module's ExternalSecret instead of one shared Secret.
  sharedSecret:
    enabled: false

# Nothing renders these once the bundled infrastructure and the shared Secret are off; cleared so
# the default-password guard does not trip outside demoMode.
secrets:
  postgresqlPassword: ""
  rabbitmqPassword: ""
  redisPassword: ""

postgresql:
  enabled: false
rabbitmq:
  enabled: false
redis:
  enabled: false

traefik:
  service:
    # Never let the gateway Service provision a public AWS load balancer as a side effect.
    # Expose it deliberately (AWS Load Balancer Controller + TLS) once DNS and certificates exist;
    # until then reach it with `kubectl port-forward`. (Traefik's chart reads service.spec.type —
    # a top-level service.type is silently ignored.)
    spec:
      type: ClusterIP
  # The chart ships with resources: {} (no requests) and a single fixed replica — meaning the
  # one thing every request in the cluster passes through has no CPU baseline for the HPA metric
  # below to scale against, and no redundancy at all. Sized off observed idle usage (~3m CPU /
  # 27Mi) with real headroom for burst, not off the fixed 1-replica request math above.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  # Omit spec.replicas entirely once autoscaling owns it (chart's own documented convention —
  # see deployment.replicas' description) rather than leaving a stale fixed value for Helm and
  # the HPA to fight over.
  deployment:
    replicas: null
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Unlike the chart-libs-based modules below, this chart does NOT auto-fill a missing
  # labelSelector — an omitted one renders as null, which matches no pod and makes the constraint
  # a no-op. So it is spelled out here. The instance label is `<release>-<namespace>`; it is
  # computed with the chart's own `traefik.instance-name` helper (the constraints go through
  # `tpl`) rather than hardcoded, so it stays correct for any release name or namespace. A
  # hardcoded value that stops matching the pods fails silently (selects nothing, spreads nothing).
  # A scalar include works under tpl; only an include returning a nested map does not.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: '{{ include "traefik.instance-name" . }}'
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: '{{ include "traefik.instance-name" . }}'

# Data-store egress (`networkPolicy.extraEgress`) is VPC-CIDR-scoped and rendered per environment
# by `just helm-values <env>` (labs64.io-devops) — it needs each environment's actual VPC CIDR,
# which differs per environment (dev/qa/prod each get their own /16) and so can't live in this
# shared file. `networkPolicy.enabled` is what's true everywhere and belongs here.
#
# api-gateway/api-docs/authz-pdp aren't in this list yet: they don't talk to a data store
# directly, but their exact egress needs (e.g. a real external IdP once Keycloak lands) haven't
# been characterized against a default-deny policy — see the README's Known gaps.
#
# HPA + PDB + topologySpreadConstraints, every module below: chart defaults ship all three
# absent/disabled (fixed replicaCount, no scale-out, no anti-collocation — the default spread
# behaviour is the soft ScheduleAnyway, which does not stop both replicas of a module landing on
# the same node). minReplicas: 2 is what actually buys availability during a drain or a SPOT
# interruption; the hard DoNotSchedule spread constraint is what actually keeps the two replicas
# on different nodes so that availability isn't accidental — a PDB alone on an unchanged
# 1-replica Deployment just blocks the drain rather than surviving it, and a soft spread
# preference can still be violated under pressure. DoNotSchedule is safe now that Cluster
# Autoscaler is running: if the constraint can't be satisfied on current capacity, the pending
# pod triggers a scale-up rather than sitting stuck forever. maxReplicas/
# targetCPUUtilizationPercentage are left at chart defaults (3 / 80%).
api-gateway:
  autoscaling:
    enabled: true
    minReplicas: 2
  # podDisruptionBudget already enabled by chart default (replicaCount: 2 already, unlike the
  # modules below) — nothing to add here.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

api-docs:
  autoscaling:
    enabled: true
    minReplicas: 2
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

auditflow:
  networkPolicy:
    enabled: true
  externalSecrets:
    enabled: true
    storeName: aws-secretsmanager-cluster
  applicationYaml:
    spring:
      rabbitmq:
        ssl:
          # Amazon MQ accepts AMQPS (TLS, 5671) only.
          enabled: true
      data:
        redis:
          ssl:
            # ElastiCache in-transit encryption is mandatory.
            enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

payment-gateway:
  networkPolicy:
    enabled: true
  # The database exists before the release (RDS), so the pre-install migration Job can run.
  migrationJob:
    enabled: true
  externalSecrets:
    enabled: true
    storeName: aws-secretsmanager-cluster
  applicationYaml:
    spring:
      data:
        redis:
          ssl:
            enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

checkout:
  networkPolicy:
    enabled: true
  migrationJob:
    enabled: true
  externalSecrets:
    enabled: true
    storeName: aws-secretsmanager-cluster
  applicationYaml:
    spring:
      rabbitmq:
        ssl:
          enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

# No hpa.yaml in this chart (not built to scale) and it already ships podDisruptionBudget.
# enabled: true / replicaCount: 2 by default — only the spread constraint is missing.
authz-pdp:
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
