{{- include "labs64io-ecosystem.guardDefaultPasswords" . -}}
{{- include "labs64io-ecosystem.guardMockOidc" . -}}
{{- if and .Values.global .Values.global.sharedSecret .Values.global.sharedSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.sharedSecret.name | default "labs64io-shared-secret" }}
  labels:
    app.kubernetes.io/name: labs64io-ecosystem
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # A pre-install hook, weight -10, for the same reason chart-libs renders each
    # module Secret as one at -5: anything running as a pre-install hook needs these
    # credentials, and ordinary release resources are not created until every
    # pre-install hook has finished.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # Paired with the password rather than put in the shared ConfigMap: it is half of
  # a credential, and lint-configmap-secrets rejects it there. Until now
  # global.postgresql.username was a dead value — declared, never rendered anywhere —
  # so nothing could resolve SPRING_DATASOURCE_USERNAME.
  SPRING_DATASOURCE_USERNAME: {{ .Values.global.postgresql.username | default "" | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.postgresqlPassword | default "" | quote }}
  SPRING_RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | default "" | quote }}
  SPRING_DATA_REDIS_PASSWORD: {{ .Values.secrets.redisPassword | default "" | quote }}
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
