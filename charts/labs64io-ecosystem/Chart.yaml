apiVersion: v2
name: labs64io-ecosystem
type: application
version: 0.19.4
description: "Labs64.IO :: Umbrella chart for deploying the Labs64.IO ecosystem and optional infrastructure"
icon: https://raw.githubusercontent.com/Labs64/.github/refs/heads/master/assets/labs64-avatar-128x128.png
home: https://labs64.io
keywords:
  - labs64
  - labs64io
  - ecosystem
  - microservices
  - platform
sources:
  - https://github.com/Labs64/labs64.io-helm-charts
maintainers:
  - name: labs64
    email: info@labs64.com
dependencies:
  - name: api-gateway
    version: ">=0.1.0"
    repository: file://../api-gateway
    condition: api-gateway.enabled
  - name: authz-pdp
    version: ">=0.1.0"
    repository: file://../authz-pdp
    condition: authz-pdp.enabled
  - name: checkout
    version: ">=0.1.0"
    repository: file://../checkout
    condition: checkout.enabled
  - name: payment-gateway
    version: ">=0.1.0"
    repository: file://../payment-gateway
    condition: payment-gateway.enabled
  - name: auditflow
    version: ">=0.1.0"
    repository: file://../auditflow
    condition: auditflow.enabled
  - name: api-docs
    version: ">=0.1.0"
    repository: file://../api-docs
    condition: api-docs.enabled
  - name: customer-portal
    version: ">=0.1.0"
    repository: file://../customer-portal
    condition: customer-portal.enabled
  # Infrastructure Opt-In
  - name: postgresql
    version: 18.7.11
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  # RabbitMQ is NOT a chart dependency — see templates/rabbitmq.yaml. Bitnami's chart pins the
  # bitnamilegacy/rabbitmq image, frozen at 4.1.3 with no path to a newer version (verified:
  # neither bitnami/rabbitmq nor bitnamilegacy/rabbitmq publish anything newer). A hand-rolled
  # StatefulSet on the official `rabbitmq` image gets RabbitMQ 4.3 — matching Amazon MQ
  # (labs64.io-devops) and the local-dev standalone tool (overrides/rabbitmq/rabbitmq.yaml).
  # Valkey, aliased as "redis" so `.Values.redis`, the Secret key names
  # (SPRING_DATA_REDIS_*) and the rendered object names (fullnameOverride below) don't
  # change. AWS ElastiCache (labs64.io-devops) runs Valkey, not Redis OSS — this keeps
  # local dev on the same engine instead of a different project that only shares the
  # wire protocol. See values.yaml's `redis:` block for the version/naming notes.
  - name: valkey
    alias: redis
    version: 6.3.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  # Gateway (opt-in). Provisions the GatewayClass + the shared labs64io-gateway that
  # every module's gateway.parentRefs points at. Without one, every HTTPRoute renders
  # and then sits Accepted:False. Default off so GitOps users who manage ingress
  # separately are unaffected; the install wizard turns it on. Pinned to the same
  # version the justfile uses (TRAEFIK_CHART_VERSION) so local dev and the published
  # path agree.
  - name: traefik
    version: "41.6.0"
    repository: https://traefik.github.io/charts
    condition: traefik.enabled
  # Dev-only IdP (opt-in, additionally gated on demoMode — see templates/_guards.tpl).
  - name: mock-oidc
    version: ">=0.1.0"
    repository: file://../mock-oidc
    condition: mock-oidc.enabled
