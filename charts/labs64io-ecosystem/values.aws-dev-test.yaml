# AWS dev-only regression-test fixtures for AuditFlow.
#
# `just regression` (labs64.io-tests) exercises pipeline condition operators, quota
# enforcement, DLQ inspection/replay, and secretRef resolution against dedicated fixture
# tenants (t_regression, t_regression_quota) that otherwise only exist in this repo's
# k3d-only overlay (overrides/auditflow/values.local.yaml). This file ports the same
# tenant/pipeline definitions (self-contained — logging_sink only, no S3/RabbitMQ
# dependency) so the same regression suite can also run against a throwaway AWS dev
# cluster. NEVER apply this to qa/prod — it exists to make `just regression` (not just
# `just smoke`) runnable against labs64-io-dev.
#
# `auditflow.tenants.additional` is a list, and Helm's default merge strategy replaces
# lists wholesale rather than concatenating — so this file restates values.demo.yaml's
# t_mock entry verbatim (needed for mock-oidc/gateway smoke tests) alongside the two
# regression fixtures, rather than only adding the new ones.
#
# "Resolvable secretRef delivers without dead-lettering" (secret_ref_resolution.robot)
# additionally needs a real Secret this values file cannot provide (Helm values aren't
# credential material — see AGENTS.md guardrail #2): run
# `just auditflow-regression-secret <env>` (labs64.io-devops) once per cluster to create
# auditflow-tenant-t-regression-creds/regressionTestKey before running the suite.
auditflow:
  tenants:
    additional:
      # Same as values.demo.yaml's own t_mock entry — restated here only because this
      # file's additional: list replaces, rather than merges with, that one.
      - tenantId: t_mock
        enabled: true
        pipelines:
          - name: demo-logging
            enabled: true
            sink:
              name: logging_sink
              properties:
                log-level: INFO
      - tenantId: t_regression
        enabled: true
        quota:
          rateLimitPerSec: 100
          burst: 200
        pipelines:
          - name: 'probe_eq_intentional_fail'
            enabled: true
            condition:
              match: 'all'
              rules:
                - field: 'extra.op'
                  operator: 'eq'
                  value: 'eq'
                - field: 'extra.value'
                  operator: 'eq'
                  value: 'target'
            transformer:
              name: 'zero'
            sink:
              name: 'logging_sink'
              properties:
                log-level: "DEBUG"
                probe-trigger: "${secretRef:regressionMissingKey}"
          - name: 'probe_neq_intentional_fail'
            enabled: true
            condition:
              match: 'all'
              rules:
                - field: 'extra.op'
                  operator: 'eq'
                  value: 'neq'
                - field: 'extra.value'
                  operator: 'neq'
                  value: 'control'
            transformer:
              name: 'zero'
            sink:
              name: 'logging_sink'
              properties:
                log-level: "DEBUG"
                probe-trigger: "${secretRef:regressionMissingKey}"
          - name: 'probe_contains_intentional_fail'
            enabled: true
            condition:
              match: 'all'
              rules:
                - field: 'extra.op'
                  operator: 'eq'
                  value: 'contains'
                - field: 'extra.value'
                  operator: 'contains'
                  value: 'needle'
            transformer:
              name: 'zero'
            sink:
