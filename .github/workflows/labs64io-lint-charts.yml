name: Labs64.IO - Helm Charts - Lint Charts

on:
  pull_request:
    paths:
      - "charts/**"
      # The checks are recipes (just ci): a change to them, or to the scripts they run, is checked too.
      - "justfile"
      - "just/**"
      - "scripts/**"
  # The chart-update PRs are opened with the workflow token, for which GitHub starts no (or only failing) pull
  # request checks, and some changes go straight to master: so the same gates also run on what lands there.
  push:
    branches:
      - master
    paths:
      - "charts/**"
      - "justfile"
      - "just/**"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history needed to diff each chart against the PR base ref below.
          fetch-depth: 0

      # Helm (and plugins) and just at the versions pinned in labs64.io-workspace/tool-versions.env —
      # the same file the dev container installs from. Also exports HELM_DOCS_VERSION etc.
      - uses: Labs64/labs64.io-workspace/.github/actions/setup-k8s-tools@v1
        with:
          helm-plugins: schema
          just: "true"
      - name: Add dependent repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add traefik https://traefik.github.io/charts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install linter dependencies
        run: pip install pyyaml pytest

      # Every check below is a recipe of just/quality-gates.just, in the order of `just ci`, which runs the same
      # chain locally. Change a check there, not here.
      - name: Test the gate scripts and the chart image updater
        # A gate nobody tests reports "clean" forever.
        run: just test

      - name: Enforce chart version bumps
        # chart-releaser skips re-publishing a chart whose Chart.yaml version already has a
        # release tag (skip_existing: true) — silently, with no error. So every chart with a
        # diff against the PR base must bump `version:`, and so must every chart that vendors
        # it (chart-libs consumers; the labs64io-ecosystem umbrella, whose version is the
        # ecosystem release number). `just bump <chart>` does all of it.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
          base="origin/$BASE_REF"
          # After a push, master is its own base: compare with the commit before the push instead.
          if [[ "$GITHUB_EVENT_NAME" == push && "$PUSHED_FROM" =~ ^[0-9a-f]{40}$ && ! "$PUSHED_FROM" =~ ^0+$ ]] \
            && git cat-file -e "$PUSHED_FROM^{commit}" 2>/dev/null; then
            base="$PUSHED_FROM"
          fi
          just check-bumps "$base"

      - name: Generated schemas and chart READMEs are committed
        run: just check-generated

      - name: Umbrella package is self-contained
        # The released umbrella must carry every dependency of every chart it bundles
        # (chart-libs in each module chart). Same check the release workflow gates on.
        run: just check-package

      - name: No credentials in ConfigMaps
        # Guardrail 3: credentials are Kubernetes Secrets, never ConfigMaps. Renders every chart (default values +
        # each overrides profile) and walks the rendered ConfigMaps — including trees nested inside
        # `applicationYaml`, which no template-level grep can see.
        run: just lint-secrets --format github

      - name: Chart authoring checklist
        # Ingress annotations, sub-path PV mounts, probe defaults and NetworkPolicy egress (guardrail 10).
        run: just lint-authoring

      - name: Lint and validate charts
        run: just lint-charts
