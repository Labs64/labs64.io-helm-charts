name: Labs64.IO - Helm Charts - Lint Charts

on:
  pull_request:
    paths:
      - "charts/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history needed to diff each chart against the PR base ref below.
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "3.17.0"

      - name: Add dependent repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add traefik https://traefik.github.io/charts

      - name: Install helm-schema plugin
        run: helm plugin install https://github.com/dadav/helm-schema

      - name: Enforce chart version bump
        # chart-releaser skips re-publishing a chart whose Chart.yaml version already has a
        # release tag (skip_existing: true) — silently, with no error. A chart whose files
        # changed but whose version didn't move (or moved backwards) would simply never reach
        # the public repo. Every chart with a diff against the PR base must bump `version:`.
        run: |
          set -euo pipefail
          BASE="origin/${{ github.event.pull_request.base.ref || 'master' }}"
          git fetch origin "${{ github.event.pull_request.base.ref || 'master' }}" --depth=1 2>/dev/null || true
          FAILED=0
          for chart_dir in charts/*/; do
            [ -f "$chart_dir/Chart.yaml" ] || continue
            chart_name=$(basename "$chart_dir")

            if git diff --quiet "$BASE" -- "$chart_dir" 2>/dev/null; then
              continue
            fi

            old_version=$(git show "$BASE:$chart_dir/Chart.yaml" 2>/dev/null | sed -n -E 's/^version: *//p' || echo "")
            new_version=$(sed -n -E 's/^version: *//p' "$chart_dir/Chart.yaml")

            if [ -z "$old_version" ]; then
              echo "NEW CHART: $chart_name ($new_version) — no version check needed"
              continue
            fi

            if [ "$old_version" = "$new_version" ]; then
              echo "FAIL: $chart_name changed but version was not bumped (still $new_version)"
              FAILED=1
              continue
            fi

            newer=$(printf '%s\n%s\n' "$old_version" "$new_version" | sort -V | tail -1)
            if [ "$newer" != "$new_version" ] || [ "$old_version" = "$new_version" ]; then
              echo "FAIL: $chart_name version $old_version -> $new_version is not an increase"
              FAILED=1
              continue
            fi

            echo "PASS: $chart_name $old_version -> $new_version"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "One or more changed charts did not get a version bump. Bump Chart.yaml's"
            echo "'version:' (and, for library-chart consumers, the pinned chart-libs"
            echo "dependency version) or the release pipeline will silently skip publishing it."
            exit 1
          fi

      - name: Enforce schema generation
        run: |
          helm schema --chart-search-root ./charts --no-dependencies --append-newline
          if ! git diff --exit-code; then
            echo "ERROR: values.schema.json files are out of date. Please run 'just generate-schema' and commit the changes."
            exit 1
          fi

      - name: Enforce docs generation
        run: |
          docker run --rm -v "$(pwd):/helm-docs" -u "$(id -u):$(id -g)" jnorwood/helm-docs:v1.14.2 --chart-search-root ./charts --log-level warning
          if ! git diff --exit-code; then
            echo "ERROR: README.md files are out of date. Please run 'just generate-docu' and commit the changes."
            exit 1
          fi

      - name: Build chart dependencies
        # Vendored deps (charts/*/charts/) are gitignored, so a fresh checkout is
        # missing them (e.g. chart-libs, a file://../chart-libs local dependency);
        # without this, every dependent chart fails to lint/template below.
        run: |
          set -euo pipefail
          for chart_dir in charts/*/; do
            [ -f "$chart_dir/Chart.yaml" ] || continue
            helm dependency build "$chart_dir"
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install linter dependencies
        run: pip install pyyaml pytest

      - name: Test the ConfigMap credential linter
        # A linter nobody tests reports "clean" forever. These tests plant
        # credentials and assert the linter catches them.
        run: pytest scripts/test_lint_configmap_secrets.py -q

      - name: No credentials in ConfigMaps
        # Guardrail 3: credentials are Kubernetes Secrets, never ConfigMaps.
        # Renders every chart (default values + each overrides profile) and walks
        # the rendered ConfigMaps — including trees nested inside `applicationYaml`,
        # which no template-level grep can see.
        run: python scripts/lint-configmap-secrets.py --format github

      - name: Test the chart authoring checklist
        # Same discipline as the ConfigMap linter above — pins each rule
        # against synthetic input so it can't quietly stop catching anything.
        run: pytest scripts/test_lint_chart_authoring.py -q

      - name: Test the chart image updater
        # The updater rewrites Chart.yaml/values.yaml unattended from a release
        # event; its all-or-nothing, idempotency and payload-validation rules
        # need the same gate as the linters.
        run: pytest scripts/test_update_chart_images.py -q

      - name: Chart authoring checklist
        # Item 30: ingress annotations (no module chart may hand-roll kind:
        # Ingress — only chart-libs.gateway-routes may, and it hard-fails on
        # non-public routes), sub-path PV mounts (allowlisted only — a subPath
        # mount doesn't receive live ConfigMap/Secret updates), probe defaults
        # (every container needs a live/ready probe with sane bounds), and
        # NetworkPolicy egress (guardrail 10 — every long-running workload
        # must be able to restrict its own egress, and never to an allow-all).
        run: python scripts/lint-chart-authoring.py

      - name: Lint and validate charts
        run: |
          set -euo pipefail
          FAILED=0
          for chart_dir in charts/*/; do
            chart_name=$(basename "$chart_dir")
            # Skip non-chart directories
            if [ ! -f "$chart_dir/Chart.yaml" ]; then
              continue
            fi
            chart_type=$(sed -n -E 's/^type: *//p' "$chart_dir/Chart.yaml")
            echo "=== Linting: $chart_name ==="

            # helm lint
            if ! helm lint "$chart_dir"; then
              echo "FAIL: helm lint $chart_name"
              FAILED=1
            fi

            # Schema validation metadata is required for both application and library charts.
            if [ ! -f "$chart_dir/values.schema.json" ]; then
              echo "FAIL: Missing values.schema.json in $chart_name"
              FAILED=1
            fi

            # A library chart only defines named templates for its consumers. Helm deliberately
            # rejects installing or rendering it on its own; consumer charts in this loop
            # exercise those templates through their file://chart-libs dependency.
            if [ "$chart_type" = "library" ]; then
              echo "SKIP: standalone template validation is not applicable to library chart $chart_name"
              echo "PASS: $chart_name"
              continue
            fi

            EXTRA_ARGS=""
            if [ "$chart_name" = "labs64io-ecosystem" ]; then
              EXTRA_ARGS="--set demoMode=true"
            fi

            # helm template (syntax + render check)
            if ! helm template "test-$chart_name" "$chart_dir" $EXTRA_ARGS > /dev/null 2>&1; then
              echo "FAIL: helm template $chart_name"
              helm template "test-$chart_name" "$chart_dir" $EXTRA_ARGS 2>&1 | tail -5
              FAILED=1
            fi

            # Render once with the committed values to exercise values.schema.json validation.
            if ! helm template "test-$chart_name" "$chart_dir" -f "$chart_dir/values.yaml" $EXTRA_ARGS > /dev/null 2>&1; then
              echo "FAIL: schema validation $chart_name"
              helm template "test-$chart_name" "$chart_dir" -f "$chart_dir/values.yaml" $EXTRA_ARGS 2>&1 | tail -5
              FAILED=1
            fi

            echo "PASS: $chart_name"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Some charts failed linting. See errors above."
            exit 1
          fi

          echo ""
          echo "All charts passed."
