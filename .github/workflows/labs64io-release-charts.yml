name: Labs64.IO - Helm Charts - Release Charts

on:
  push:
    branches:
      - master
    paths:
      - 'charts/**'
  workflow_dispatch:

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # Helm (and plugins) at the versions pinned in labs64.io-workspace/tool-versions.env —
      # the same file the dev container installs from. Also exports HELM_DOCS_VERSION etc.
      - uses: Labs64/labs64.io-workspace/.github/actions/setup-k8s-tools@v1

      - name: Add dependent repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add traefik https://traefik.github.io/charts

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Exclude not-to-be-released charts
        run: |
          EXCLUDED_CHARTS=("overrides")
          for chart in "${EXCLUDED_CHARTS[@]}"; do
            rm -rf "./charts/$chart"
          done
          ls -la ./charts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install gate dependencies
        run: pip install pyyaml

      - name: Build chart dependencies
        # Vendored deps (charts/*/charts/) are gitignored, so this checkout has none, and
        # chart-releaser only packages the charts that changed in this push. Every module
        # chart that did NOT change would reach the umbrella without its `chart-libs`
        # dependency, and the released umbrella then fails at render time with
        # `no template "chart-libs.test-connection"`. Build every chart's dependencies
        # up front, the umbrella last (it vendors the module charts, deps included): scripts/build-chart-dependencies.sh.
        run: bash scripts/build-chart-dependencies.sh

      - name: Verify the umbrella package is self-contained
        # A published chart version is immutable (skip_existing), so a broken package cannot
        # be fixed in place — only superseded. Fail before anything is released.
        run: |
          set -euo pipefail
          helm package charts/labs64io-ecosystem --destination "$RUNNER_TEMP/verify"
          python scripts/check-packaged-chart.py "$RUNNER_TEMP"/verify/labs64io-ecosystem-*.tgz

      - name: Run chart-releaser
        id: releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # The deployed umbrella pin of an environment is a Renovate PR: ask the runner to
      # look now instead of at its next scheduled run. Only when a chart was actually published; the step
      # never fails the release (without the secret it warns).
      - name: Ask Renovate to propose the new chart
        if: steps.releaser.outputs.changed_charts != ''
        uses: Labs64/labs64.io-workspace/.github/actions/renovate-trigger@v1
        with:
          token: ${{ secrets.RENOVATE_TRIGGER_TOKEN }}
          runner-repository: ${{ vars.RENOVATE_RUNNER_REPOSITORY }}
          reason: charts released (${{ steps.releaser.outputs.changed_charts }})
