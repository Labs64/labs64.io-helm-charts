{{- $password := required "auth.password is required (set it in overrides/rabbitmq/values.secrets.local.yaml)" .Values.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  labels:
    {{- include "rabbitmq-local.labels" . | nindent 4 }}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: {{ .Values.auth.username | quote }}
  RABBITMQ_DEFAULT_PASS: {{ $password | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    {{- include "rabbitmq-local.labels" . | nindent 4 }}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        {{- include "rabbitmq-local.labels" . | nindent 8 }}
    spec:
      securityContext:
        # `rabbitmq` user/group in the official alpine image.
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        # Without this kubelet re-applies g+rw to the whole volume on EVERY pod start, which turns
        # RabbitMQ's own 0400 /var/lib/rabbitmq/.erlang.cookie into 0660 — Erlang then refuses to
        # boot ("Cookie file ... must be accessible by owner only"). A fresh volume starts fine and
        # every restart crash-loops. OnRootMismatch re-owns the volume only once, before RabbitMQ
        # has created the cookie. Same fix as the umbrella chart's templates/rabbitmq.yaml.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          envFrom:
            - secretRef:
                name: rabbitmq
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_port_connectivity"]
            # This starts an Erlang CLI process and can be slow while local k3d
            # is under CPU pressure. Keep it as readiness, where a delay does
            # not restart an otherwise working broker.
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 5
          livenessProbe:
            # A TCP listener is sufficient to decide whether the broker must
            # be restarted. `rabbitmq-diagnostics status` is intentionally
            # reserved for readiness because its Erlang CLI may exceed a short
            # exec timeout under local CPU throttling.
            tcpSocket:
              port: amqp
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "rabbitmq-local.labels" . | nindent 4 }}
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
