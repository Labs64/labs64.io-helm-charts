replicaCount: 1

image:
  repository: localhost:5005/traefik-authproxy
  tag: latest
  pullPolicy: Always

# OIDC settings and the matching NetworkPolicy egress come from oidc-<provider>.local.yaml,
# selected by identityProvider in overrides/helmfile/values.local.yaml (one switch, no edits here).
networkPolicy:
  enabled: true

logLevel: DEBUG

# Local development overrides for gateway-common
rateLimit:
  average: 100
  burst: 50
