# AWS (staging/prod) deltas on top of values.yaml — production mode on RDS PostgreSQL, credentials
# from Secrets Manager. You supply the environment's coordinates as the last values file:
#   labs64io.hostname, labs64io.externalSecrets.secretKey, database.hostname/port/username,
#   networkPolicy.egress (full list — DNS, replicas, the VPC CIDR on 5432), replicas.
# Realm: realm.base.json; plus realm.test-fixtures.json in development environments only
# (labs64io.testFixtures — never in production); plus the machine clients of the environment's
# tenants (labs64io.serviceClients).
labs64io:
  realmSslRequired: external
  externalSecrets:
    enabled: true
  databaseBootstrap:
    enabled: true

command:
  - /opt/keycloak/bin/kc.sh
  - start

# The public edge is ALB → Traefik → Keycloak; both send X-Forwarded-* (not RFC 7239 Forwarded).
# Traefik only passes the ALB's headers through from the VPC CIDR (set in its environment values).
proxy:
  mode: xforwarded

database:
  vendor: postgres
  port: 5432
  database: keycloak
  existingSecret: keycloak-db
  existingSecretKey: password

dbchecker:
  enabled: true

# jdbc-ping cluster cache (chart default when cache.stack=default): replicas discover each other
# through the database and talk JGroups on 7800 (+57800 failure detection). Declared as pod ports so
# the chart's NetworkPolicy admits replica-to-replica traffic on them (it only lists 8080/8443 plus
# extraPorts).
cache:
  stack: default
extraPorts:
  - name: jgroups
    containerPort: 7800
    protocol: TCP
  - name: jgroups-fd
    containerPort: 57800
    protocol: TCP

# CPU request: ~2m idle, but 118m p95 / 134m peak while a load test fetched tokens (dev, `just
# loadtest`). 250m kept a quarter of a node's requests from the autoscaler's bin-packing for
# nothing; 100m was below the busy case. There is no CPU limit, so JVM startup and login bursts
# still use what the node has free; the request decides how many CPU shares Keycloak gets when the
# node is contended, and that is when it matters.
resources:
  requests:
    cpu: 150m
    memory: 768Mi
  limits:
    memory: 1536Mi

podDisruptionBudget:
  maxUnavailable: 1
