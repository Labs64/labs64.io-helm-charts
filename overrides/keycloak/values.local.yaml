# Local-only configuration for the pinned codecentric/keycloakx chart.
# It runs the official Keycloak image and persists the dev-file database locally.
nameOverride: keycloak
fullnameOverride: keycloak
replicas: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.6.4"
  pullPolicy: IfNotPresent

command:
  - /opt/keycloak/bin/kc.sh
  - start-dev

proxy:
  enabled: true
  mode: forwarded
  http:
    enabled: true

http:
  relativePath: "/"

cache:
  stack: custom

metrics:
  enabled: true
health:
  enabled: true

extraEnv: |
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: admin
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: password
  - name: KC_HOSTNAME
    value: http://keycloak.localhost
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "true"
  - name: KC_HOSTNAME_STRICT
    value: "true"

serviceAccount:
  automountServiceAccountToken: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

volumeClaimTemplates: |
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

extraVolumeMounts: |
  - name: data
    mountPath: /opt/keycloak/data

networkPolicy:
  enabled: true
  extraFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tools
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: labs64io
      podSelector:
        matchLabels:
          app.kubernetes.io/name: api-gateway
    # The post-install hook imports the realm through Keycloak's HTTP Service.
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: keycloak-config-cli
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# Populated through helmfile --set-file from realm.local.json.
realmConfig: ""

extraManifests:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: keycloak-realm-config
      namespace: {{ .Release.Namespace }}
    data:
      realm.json: |
        {{ .Values.realmConfig | nindent 8 }}
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: keycloak
      namespace: {{ .Release.Namespace }}
    spec:
      parentRefs:
        - name: labs64io-gateway
          namespace: tools
      hostnames:
        - keycloak.localhost
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /realms
          backendRefs:
            - name: keycloak-http
              port: 80
  - |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: keycloak-config-cli
      namespace: {{ .Release.Namespace }}
      annotations:
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-weight: "10"
        helm.sh/hook-delete-policy: before-hook-creation
    spec:
      backoffLimit: 6
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keycloak-config-cli
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: keycloak-config-cli
              image: docker.io/adorsys/keycloak-config-cli:6.5.1-26
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: KEYCLOAK_URL
                  value: http://keycloak-http:80
                - name: KEYCLOAK_USER
                  value: admin
                - name: KEYCLOAK_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-admin
                      key: password
                - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
                  value: "true"
                - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
                  value: 180s
                - name: IMPORT_FILES_LOCATIONS
                  value: /config/*
                - name: IMPORT_VARSUBSTITUTION_ENABLED
                  value: "true"
                - name: IMPORT_CACHE_ENABLED
                  value: "false"
              envFrom:
                - secretRef:
                    name: keycloak-realm-secrets
              volumeMounts:
                - name: realm-config
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: realm-config
              configMap:
                name: keycloak-realm-config
