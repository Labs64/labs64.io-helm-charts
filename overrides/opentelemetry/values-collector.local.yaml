mode: daemonset

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"

image:
  repository: otel/opentelemetry-collector-contrib
  # Pinned to the appVersion of the collector chart pinned in the justfile
  # (OTEL_COLLECTOR_CHART_VERSION 0.165.0 -> appVersion 0.156.0), so the image and the
  # chart's config schema always move together. `latest` let collector behaviour shift
  # under an unchanged chart on every pull. Bump both numbers in the same commit.
  tag: 0.156.0

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
    storeCheckpoints: false
    maxRecombineLogSize: 102400
  hostMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: true
    # This can lead to a lot of labels, which might increase cardinality and cost in your backend, but it ensures you get all available labels.
    # Be mindful of this in production!
    extractAllPodLabels: true
    # Similar to labels, annotations can also add significant metadata.
    extractAllPodAnnotations: true
  kubeletMetrics:
    enabled: false
  kubernetesEvents:
    enabled: true
  clusterMetrics:
    enabled: false

clusterRole:
  create: true

config:
  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}
    prometheus:
      config:
        scrape_configs:
          - job_name: "kubernetes-pods"
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              # Only scrape pods that opt in via the prometheus.io/scrape annotation.
              - source_labels:
                  [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: true
              # Honor prometheus.io/path (e.g. /actuator/prometheus for Spring Boot).
              - source_labels:
                  [__meta_kubernetes_pod_annotation_prometheus_io_path]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              # Honor prometheus.io/port — rewrite the scrape address to podIP:port.
              - source_labels:
                  [
                    __address__,
                    __meta_kubernetes_pod_annotation_prometheus_io_port,
                  ]
                action: replace
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $$1:$$2
                target_label: __address__
              # Set `job` to the stable service name (app.kubernetes.io/name) so
              # per-service SLO rules and dashboards can filter by job.
              - source_labels:
                  [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                action: replace
                target_label: job
                regex: (.+)
              # Expose namespace and pod as labels for drill-down. NOTE: the label
              # is named k8s_namespace (not `namespace`) on purpose — a `namespace`
              # target label is promoted to the service.namespace resource attribute,
              # which makes the prometheusremotewrite exporter emit job as
              # "<namespace>/<name>" instead of the bare service name the SLO rules expect.
              - source_labels: [__meta_kubernetes_namespace]
                action: replace
                target_label: k8s_namespace
              - source_labels: [__meta_kubernetes_pod_name]
                action: replace
                target_label: pod
    filelog:
      include:
        - /var/lib/docker/containers/*.log
        #- /var/log/containers/*.log
        #- /var/log/pods/*/*.log
      start_at: beginning
      # Exclude logs from the collector itself to avoid self-loop
      exclude: [/var/log/pods/*/otel-collector-*.log]
      # Parse multiline logs (e.g., stack traces)
      #multiline:
      #  pattern: '^\S'
      #  line_end_pattern: '^\S'
      # Optional: for Kubernetes enrichment, ensure you have the `k8sattributes` processor in your pipeline
      # body:
      #   # If you want to customize how logs are parsed (e.g., JSON, regex)
      #   # check out the filelog receiver documentation for more options.
      #   encoding: utf-8
      #   attributes:
      #     # Add Kubernetes metadata
      #     kubernetes.pod.name: "$FILE_NAME_REGEX(^/var/log/pods/[^/]+/[^/]+_([^/]+)/)"
      #     kubernetes.namespace.name: "$FILE_NAME_REGEX(^/var/log/pods/([^/]+)/)"
      #     kubernetes.container.name: "$FILE_NAME_REGEX(^/var/log/pods/[^/]+/[^/]+_([^/]+)-([^_]+)/)"

  processors:
    # NOTE: do not add a filter here for Loki canary heartbeats. The canary runs with
    # `-push=true` and writes straight to Loki's push API, so its records never traverse
    # this collector — the only effective control is `lokiCanary.enabled` in
    # overrides/loki/values.local.yaml.
    # Drop kubelet probe traffic before it reaches Tempo. Probes fire every few seconds
    # per pod and otherwise dominate the trace list.
    #
    # Matched on three fronts because the runtimes disagree on attributes: the Java agent
    # (2.29.0) emits stable HTTP semconv (`url.path`), while the Python distro (0.65b0)
    # may still emit legacy `http.target` unless OTEL_SEMCONV_STABILITY_OPT_IN=http is set.
    # Span name is the backstop for both. Each attribute is nil-guarded — `and`
    # short-circuits, so IsMatch never sees a nil on services that lack the attribute.
    #
    # Operational endpoints dropped, and why each is safe:
    #   /actuator/health/**  Java probe endpoints
    #   /actuator/prometheus Micrometer scrape target — hit every scrape interval, per pod
    #   /actuator/info       static build metadata
    #   /actuator/metrics/** Micrometer browse API (has sub-paths, e.g. /jvm.memory.used)
    #   /health /ready /live /info  Python sinks + transformers — this is exactly the set
    #                        those services already suppress from uvicorn access logs
    #                        (HEALTH_PATHS in auditflow-{sink,transformer}/health.py)
    #   /health/ready /health/live  api-gateway
    #
    # Deliberately NOT dropped: /actuator/dlq. Spring Boot exposes
    # `health,info,metrics,prometheus,dlq`, and dlq is a real admin-gated business endpoint
    # (api-gateway route `auditflow-dlq`, admin-role/auditflow-role) whose traces matter.
    # That is why this enumerates actuator endpoints instead of matching /actuator/**.
    filter/drop_health_checks:
      error_mode: ignore
      traces:
        span:
          - >-
            attributes["url.path"] != nil
            and IsMatch(attributes["url.path"],
            "^/(actuator/(health(/.*)?|info|metrics(/.*)?|prometheus)|health(/(ready|live))?|ready|live|info)$")
          - >-
            attributes["http.target"] != nil
            and IsMatch(attributes["http.target"],
            "^/(actuator/(health(/.*)?|info|metrics(/.*)?|prometheus)|health(/(ready|live))?|ready|live|info)([?].*)?$")
          - >-
            IsMatch(name,
            "^(GET|HEAD) /(actuator/(health(/.*)?|info|metrics(/.*)?|prometheus)|health(/(ready|live))?|ready|live|info)$")
    batch:
      send_batch_size: 256
      timeout: 10s
    batch/traces:
      send_batch_size: 256
      timeout: 10s
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

  exporters:
    debug:
      verbosity: detailed
    prometheusremotewrite:
      endpoint: "http://prometheus-kube-prometheus-prometheus:9090/api/v1/write"
      tls:
        insecure: true
    otlp/tempo:
      endpoint: "tempo.monitoring.svc.cluster.local:4317"
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: "http://loki.monitoring.svc.cluster.local:3100/otlp"
      tls:
        insecure: true

  service:
    pipelines:
      metrics:
        receivers: [otlp, prometheus]
        processors: [batch]
        exporters: [prometheusremotewrite]
      traces:
        receivers: [otlp]
        # memory_limiter first so it can shed load before anything buffers; filter next so
        # dropped probe spans never occupy a batch.
        processors: [memory_limiter, filter/drop_health_checks, batch/traces]
        exporters: [otlp/tempo]
      logs:
        receivers: [filelog, otlp]
        processors: [batch]
        exporters: [otlphttp/loki]
