mode: daemonset

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"

image:
  repository: otel/opentelemetry-collector-contrib
  # Pinned to the appVersion of the collector chart pinned in the justfile
  # (OTEL_COLLECTOR_CHART_VERSION 0.165.0 -> appVersion 0.156.0), so the image and the
  # chart's config schema always move together. `latest` let collector behaviour shift
  # under an unchanged chart on every pull. Bump both numbers in the same commit.
  tag: 0.156.0

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
    # Persists filelog read offsets via a file_storage extension. With this false and
    # `start_at: beginning`, every collector restart re-shipped the entire log history to
    # Loki. The same extension backs the exporters' persistent sending queues below.
    storeCheckpoints: true
    maxRecombineLogSize: 102400
  hostMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: true
    # Both were true, which promoted every pod label AND annotation to a resource
    # attribute — the cardinality blow-up the original comment warned about. The preset
    # still extracts standard pod/namespace/node metadata with these off. Note the
    # metrics `job` label does NOT depend on this: it comes from the prometheus
    # receiver's own service discovery relabeling further down.
    extractAllPodLabels: false
    extractAllPodAnnotations: false
  kubeletMetrics:
    enabled: false
  kubernetesEvents:
    enabled: true
  clusterMetrics:
    enabled: false

clusterRole:
  create: true

config:
  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}
    prometheus:
      config:
        scrape_configs:
          - job_name: "kubernetes-pods"
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              # Only scrape pods that opt in via the prometheus.io/scrape annotation.
              - source_labels:
                  [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: true
              # Honor prometheus.io/path (e.g. /actuator/prometheus for Spring Boot).
              - source_labels:
                  [__meta_kubernetes_pod_annotation_prometheus_io_path]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              # Honor prometheus.io/port — rewrite the scrape address to podIP:port.
              - source_labels:
                  [
                    __address__,
                    __meta_kubernetes_pod_annotation_prometheus_io_port,
                  ]
                action: replace
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $$1:$$2
                target_label: __address__
              # Set `job` to the stable service name (app.kubernetes.io/name) so
              # per-service SLO rules and dashboards can filter by job.
              - source_labels:
                  [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                action: replace
                target_label: job
                regex: (.+)
              # Expose namespace and pod as labels for drill-down. NOTE: the label
              # is named k8s_namespace (not `namespace`) on purpose — a `namespace`
              # target label is promoted to the service.namespace resource attribute,
              # which makes the prometheusremotewrite exporter emit job as
              # "<namespace>/<name>" instead of the bare service name the SLO rules expect.
              - source_labels: [__meta_kubernetes_namespace]
                action: replace
                target_label: k8s_namespace
              - source_labels: [__meta_kubernetes_pod_name]
                action: replace
                target_label: pod
    filelog:
      # k3d runs containerd, not Docker, so container stdout lives under /var/log/pods/
      # as <namespace>_<pod>_<uid>/<container>/N.log — three path segments. This used to
      # point at /var/lib/docker/containers/*.log, a Docker-runtime path that is empty on
      # a k3d node, so this receiver collected nothing and only OTLP-exported logs reached
      # Loki. The chart mounts both host paths, so only the glob needed correcting.
      include:
        - /var/log/pods/*/*/*.log
      # Read only new lines. Offsets persist via storeCheckpoints above, so a restart
      # resumes where it left off instead of replaying history.
      start_at: end
      # Skip the collector's own logs to avoid a feedback loop. This must match the
      # include glob's depth — the previous value had two path segments against a
      # three-segment include and so never matched anything.
      exclude:
        - /var/log/pods/*_otel-collector*/*/*.log
      # Parse multiline logs (e.g., stack traces)
      #multiline:
      #  pattern: '^\S'
      #  line_end_pattern: '^\S'
      # Optional: for Kubernetes enrichment, ensure you have the `k8sattributes` processor in your pipeline
      # body:
      #   # If you want to customize how logs are parsed (e.g., JSON, regex)
      #   # check out the filelog receiver documentation for more options.
      #   encoding: utf-8
      #   attributes:
      #     # Add Kubernetes metadata
      #     kubernetes.pod.name: "$FILE_NAME_REGEX(^/var/log/pods/[^/]+/[^/]+_([^/]+)/)"
      #     kubernetes.namespace.name: "$FILE_NAME_REGEX(^/var/log/pods/([^/]+)/)"
      #     kubernetes.container.name: "$FILE_NAME_REGEX(^/var/log/pods/[^/]+/[^/]+_([^/]+)-([^_]+)/)"

  processors:
    # NOTE: do not add a filter here for Loki canary heartbeats. The canary runs with
    # `-push=true` and writes straight to Loki's push API, so its records never traverse
    # this collector — the only effective control is `lokiCanary.enabled` in
    # overrides/loki/values.local.yaml.
    # Drop kubelet probe traffic before it reaches Tempo. Probes fire every few seconds
    # per pod and otherwise dominate the trace list.
    #
    # Matched on three fronts because the runtimes disagree on attributes: the Java agent
    # (2.29.0) emits stable HTTP semconv (`url.path`), while the Python distro (0.65b0)
    # may still emit legacy `http.target` unless OTEL_SEMCONV_STABILITY_OPT_IN=http is set.
    # Span name is the backstop for both. Each attribute is nil-guarded — `and`
    # short-circuits, so IsMatch never sees a nil on services that lack the attribute.
    #
    # Operational endpoints dropped, and why each is safe:
    #   /actuator/health/**  Java probe endpoints
    #   /actuator/prometheus Micrometer scrape target — hit every scrape interval, per pod
    #   /actuator/info       static build metadata
    #   /actuator/metrics/** Micrometer browse API (has sub-paths, e.g. /jvm.memory.used)
    #   /health /ready /live /info  Python sinks + transformers — this is exactly the set
    #                        those services already suppress from uvicorn access logs
    #                        (HEALTH_PATHS in auditflow-{sink,transformer}/health.py)
    #   /health/ready /health/live  api-gateway
    #
    # Deliberately NOT dropped: /actuator/dlq. Spring Boot exposes
    # `health,info,metrics,prometheus,dlq`, and dlq is a real admin-gated business endpoint
    # (api-gateway route `auditflow-dlq`, admin-role/auditflow-role) whose traces matter.
    # That is why this enumerates actuator endpoints instead of matching /actuator/**.
    filter/drop_health_checks:
      error_mode: ignore
      traces:
        span:
          - >-
            attributes["url.path"] != nil
            and IsMatch(attributes["url.path"],
            "^/(actuator/(health(/.*)?|info|metrics(/.*)?|prometheus)|health(/(ready|live))?|ready|live|info)$")
          - >-
            attributes["http.target"] != nil
            and IsMatch(attributes["http.target"],
            "^/(actuator/(health(/.*)?|info|metrics(/.*)?|prometheus)|health(/(ready|live))?|ready|live|info)([?].*)?$")
          - >-
            IsMatch(name,
            "^(GET|HEAD) /(actuator/(health(/.*)?|info|metrics(/.*)?|prometheus)|health(/(ready|live))?|ready|live|info)$")
    # Adds host.name / os.* to every signal. Deliberately limited to detectors that need
    # no extra RBAC: the k8snode detector would require nodes/get, which this chart's
    # ClusterRole does not grant (kubeletMetrics and clusterMetrics presets are off).
    # Pod/namespace/node metadata already arrives via the k8sattributes preset.
    resourcedetection:
      detectors: [env, system]
      timeout: 2s
      override: false
      system:
        hostname_sources: [os]
    batch:
      send_batch_size: 256
      timeout: 10s
    batch/traces:
      send_batch_size: 256
      timeout: 10s
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

  # Every exporter below carries a persistent sending queue plus retry. Previously a
  # Tempo, Loki or Prometheus restart silently discarded in-flight telemetry; the queue is
  # backed by the same file_storage extension as the filelog checkpoints, so it also
  # survives a collector restart.
  #
  # Endpoints use bare service names rather than <svc>.monitoring.svc.cluster.local. This
  # is what commit 192e98f said it did but did not — that diff only stripped the http://
  # prefix from the Tempo gRPC endpoint. Bare names resolve because the collector runs in
  # the same namespace as Tempo/Loki/Prometheus; if it is ever moved, these need the
  # namespace back.
  exporters:
    prometheusremotewrite:
      endpoint: "http://prometheus-kube-prometheus-prometheus:9090/api/v1/write"
      tls:
        insecure: true
      # NOTE: no sending_queue here. Unlike the OTLP exporters, prometheusremotewrite in
      # collector 0.156.0 rejects that key outright ("has invalid keys: sending_queue")
      # and the collector refuses to start. It keeps its own internal queue instead.
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
    otlp/tempo:
      endpoint: "tempo:4317"
      tls:
        insecure: true
      sending_queue:
        enabled: true
        storage: file_storage
        num_consumers: 4
        queue_size: 1000
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
    otlphttp/loki:
      endpoint: "http://loki:3100/otlp"
      tls:
        insecure: true
      sending_queue:
        enabled: true
        storage: file_storage
        num_consumers: 4
        queue_size: 1000
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s

  connectors:
    # Derives RED metrics (rate / errors / duration) from spans with no application
    # change, feeding the SLO recording rules and Grafana dashboards in this repo.
    # Wired as an exporter on the traces pipeline and a receiver on the metrics pipeline.
    # Because it sits at the end of the traces pipeline it sees post-filter spans, so
    # dropped probe traffic never inflates these metrics.
    spanmetrics:
      histogram:
        explicit:
          buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
      dimensions:
        - name: http.request.method
        - name: http.response.status_code
        - name: http.route
      exemplars:
        enabled: true
      metrics_flush_interval: 30s

  service:
    pipelines:
      # memory_limiter leads every pipeline so it can shed load before anything buffers.
      # It previously guarded only traces, leaving logs and metrics to OOM the collector
      # instead of dropping data under pressure.
      metrics:
        receivers: [otlp, prometheus, spanmetrics]
        processors: [memory_limiter, resourcedetection, batch]
        exporters: [prometheusremotewrite]
      traces:
        receivers: [otlp]
        # filter before batch so dropped probe spans never occupy a batch slot.
        processors:
          [memory_limiter, resourcedetection, filter/drop_health_checks, batch/traces]
        exporters: [otlp/tempo, spanmetrics]
      logs:
        receivers: [filelog, otlp]
        processors: [memory_limiter, resourcedetection, batch]
        exporters: [otlphttp/loki]
