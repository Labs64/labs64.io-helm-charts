# AWS Staging / Prod: the metrics collector (its own release:
# upstream opentelemetry-collector chart, release `metrics-collector` in the `monitoring` namespace).
#
# One pod scrapes the modules' /actuator/prometheus, reads a few cluster-state series from the Kubernetes
# API (pod phase, node conditions, HPA replicas), and writes both to an Amazon Managed Service for
# Prometheus workspace (remote write signed with SigV4). Metrics only: on AWS traces go
# to the CloudWatch agent and logs to Fluent Bit (the amazon-cloudwatch-observability EKS add-on).
#
# What you supply per environment, as the last values file:
#   serviceAccount.annotations   the IAM role that may write to the workspace (IRSA)
#   extraEnvs                    AMP_REMOTE_WRITE_ENDPOINT, AWS_REGION
#   networkPolicy.egressRules    DNS, the API server, the module pods and HTTPS
# and, on the module charts, the prometheus.io/* pod annotations this collector selects by.

mode: deployment
# One replica on purpose: two would scrape and write every series twice.
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  # The appVersion of the collector chart pinned in helmfile.yaml.gotmpl, as in
  # values-collector.local.yaml (which says how to update it): the image and the chart's config
  # schema move together, and `just check-pins` fails while the stamp below differs from the chart.
  # chart-pin: opentelemetry-collector 0.177.0
  tag: 0.163.2

serviceAccount:
  create: true
  # The IAM role's trust policy names this ServiceAccount.
  name: metrics-collector

# kubernetes_sd (role: pod) lists and watches pods; the k8s_cluster receiver (cluster state, below) reads
# what it builds its metrics from. Read-only.
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/status", "nodes", "nodes/spec", "namespaces", "namespaces/status", "events",
                  "replicationcontrollers", "replicationcontrollers/status", "resourcequotas", "services"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list", "watch"]

# Nothing sends to this collector: no receiver ports and no Service (one without ports is invalid).
service:
  enabled: false
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# CPU request ~2m used on dev between scrapes. There is no CPU limit, so a scrape burst still uses what
# the node has idle; the request only reserves scheduling room.
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 384Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Nothing may connect to the pod (the kubelet's probes of health_check on 13133 are not subject to
# NetworkPolicy), and it may connect only to what your environment values list as egressRules (they name
# the environment's namespaces). The chart's policy always has one ingress rule for the enabled
# ports; with none enabled and no `from` that rule would admit everything, so it is given a source
# that is only the collector itself.
networkPolicy:
  enabled: true
  allowIngressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: opentelemetry-collector
          app.kubernetes.io/instance: '{{ .Release.Name }}'

# The whole configuration, not merged with the chart's default one (which defines OTLP, Jaeger and
# Zipkin receivers and three pipelines this collector must not have).
alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
    sigv4auth:
      region: ${env:AWS_REGION}
      service: aps

  receivers:
    prometheus:
      config:
        scrape_configs:
          # Same selection as the local collector (values-collector.local.yaml): pods that opt in
          # with prometheus.io/scrape, at prometheus.io/port and prometheus.io/path.
          - job_name: kubernetes-pods
            scrape_interval: 60s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: "true"
              # Only the namespaces this collector may reach. Discovery is cluster-wide, so it also
              # finds annotated pods its NetworkPolicy (and theirs) keeps it away from, the gateway
              # and the load balancer controller for example: each of them then costs a 10 s timeout
              # every minute and an `up == 0` series. SCRAPE_NAMESPACES is a regex over namespace
              # names (extraEnvs in your environment values); unset, every namespace is scraped.
              - source_labels: [__meta_kubernetes_namespace]
                action: keep
                regex: ${env:SCRAPE_NAMESPACES:-.+}
              - source_labels: [__meta_kubernetes_pod_phase]
                action: drop
                regex: Pending|Succeeded|Failed
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                action: replace
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $$1:$$2
                target_label: __address__
              # job = <namespace>/<app.kubernetes.io/name>: the form the charts' SLO rules select by
              # (chart-libs.slo.prometheusrule) and an operator's own alert rules use. Set here in
              # full, so it does not depend on how an exporter combines resource attributes.
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app_kubernetes_io_name]
                action: replace
                separator: /
                target_label: job
              - source_labels: [__meta_kubernetes_namespace]
                action: replace
                target_label: k8s_namespace
              - source_labels: [__meta_kubernetes_pod_name]
                action: replace
                target_label: pod
    # Cluster state from the Kubernetes API, for the alert rules that would otherwise need CloudWatch
    # Container Insights' enhanced mode: pods stuck Pending, nodes under memory or disk pressure, an HPA
    # at its maximum. Only those series are kept (filter/cluster): a handful per node and pod.
    k8s_cluster:
      auth_type: serviceAccount
      collection_interval: 60s
      node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
      allocatable_types_to_report: []

  processors:
    filter/cluster:
      error_mode: ignore
      metrics:
        metric:
          - 'not IsMatch(name, "^k8s\\.(pod\\.phase|node\\.condition_.+|hpa\\.(current|max)_replicas)$")'
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      send_batch_size: 1000
      timeout: 15s

  exporters:
    prometheusremotewrite:
      endpoint: ${env:AMP_REMOTE_WRITE_ENDPOINT}
      auth:
        authenticator: sigv4auth
      # Nothing joins on target_info, and it is one extra series per pod (see the local values).
      target_info:
        enabled: false
      # (No sending_queue: this exporter rejects the key and keeps its own queue.)
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
    # The cluster state: its resource attributes (k8s.namespace.name, k8s.pod.name, k8s.node.name,
    # k8s.hpa.name) become labels, and names stay the receiver's with dots as underscores
    # (k8s_pod_phase, k8s_node_condition_memory_pressure, k8s_hpa_current_replicas): no unit suffixes.
    prometheusremotewrite/cluster:
      endpoint: ${env:AMP_REMOTE_WRITE_ENDPOINT}
      auth:
        authenticator: sigv4auth
      # Deprecated in favour of resource_constant_labels (warned at start), still supported; switch when
      # the collector removes it.
      resource_to_telemetry_conversion:
        enabled: true
      translation_strategy: UnderscoreEscapingWithoutSuffixes
      target_info:
        enabled: false
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s

  service:
    extensions: [health_check, sigv4auth]
    pipelines:
      metrics:
        receivers: [prometheus]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]
      metrics/cluster:
        receivers: [k8s_cluster]
        processors: [memory_limiter, filter/cluster, batch]
        exporters: [prometheusremotewrite/cluster]
