# Dashboard is served via a Gateway API HTTPRoute (dashboard-httproute.yaml) on
# dashboard.localhost instead of the chart's IngressRoute. api.insecure serves the
# dashboard/API on the internal `traefik` entrypoint (:8080), which the route
# targets through the Service. DEV ONLY — never enable api.insecure in production.
api:
  insecure: true
ports:
  traefik:
    expose:
      default: true
  # All Labs64.IO backends are OpenAPI-first Java/Python services that don't rely on
  # raw encoded slashes/nulls/etc surviving in the path — reject them at the edge so
  # Traefik's routing decision can never diverge from what the backend sees (the
  # "split-view" RFC 3986 risk called out at startup).
  web:
    http:
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
ingressRoute:
  dashboard:
    enabled: false

# Drop request headers whose name merely aliases another one (X_Auth_User, X.Auth.User for
# X-Auth-User). The Auth Gateway strips and rewrites the real X-Auth-* headers, but a backend that
# derives variable names from header names (nginx $http_x_auth_user, CGI/WSGI) would read the alias
# as the trusted header and let a client spoof it. Traefik warns about it at every start.
global:
  aliasHeadersStrategy: delete

# Gateway API is now the routing substrate: modules own HTTPRoutes that attach to
# the platform Gateway below. ForwardAuth/rate-limit/compress remain Traefik
# Middlewares referenced from the HTTPRoutes via ExtensionRef.
providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    # Explicit: chart 42.4.0 stopped defaulting it, and Traefik then warns at every start. false keeps the
    # legacy router and middleware names the modules' HTTPRoutes were written against; true renames them.
    safeNaming: false

# Chart-provisioned GatewayClass (referenced by the Gateway below).
gatewayClass:
  enabled: true

# Chart-provisioned platform Gateway. Modules in the labs64io namespace attach
# their HTTPRoutes here via parentRefs {name: labs64io-gateway, namespace: tools},
# so the listener must allow routes from all namespaces.
gateway:
  enabled: true
  name: labs64io-gateway
  namespace: tools
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All

