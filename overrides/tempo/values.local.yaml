# grafana-community/tempo 3.x runs Tempo 3 in monolithic mode (no Kafka). Compared with the
# 1.x chart, `tempo.searchEnabled` (search is always on) and the bundled-Grafana switch no
# longer exist, `tempo.ingester` became `tempo.liveStore` and `tempo.retention` renders into
# the backend scheduler; none of those were set here.
tempo:
  metricsGenerator:
    enabled: true # Generates metrics from spans
    remoteWriteUrl: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
  storage:
    trace:
      backend: local # For production, use a supported object store like S3 or GCS.
      local:
        path: /var/tempo/traces
