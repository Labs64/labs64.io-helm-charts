# Kept deliberately close to the `redis` block in
# charts/labs64io-ecosystem/values.yaml. Local dev exists to catch problems before
# users do, which it cannot do while running a different architecture and auth model
# than the published path: this ran `replication` with auth off while the umbrella
# runs `standalone` with auth on, so `just up` never exercised either.
#
# The password is inline rather than the umbrella's `existingSecret:
# labs64io-shared-secret`, for the same reason postgresql/values.local.yaml is:
# that Secret is created by the umbrella chart in the labs64io namespace, and this
# release lives in `tools` — a Secret cannot be referenced across namespaces. The
# shape that matters (standalone, auth enabled) is what is converged here.
#
# This release is bitnami/valkey (see helmfile.yaml.gotmpl) — its standalone node config
# lives under `primary:`, not the older Redis chart's `master:` key, and its service name
# is "<fullname>-primary" (not "-master"); fullnameOverride keeps that plain "redis" like
# before the swap (overrides/global-values.yaml's global.redis.host depends on it).
# Pinned by digest (the multi-arch image index): docker.io/bitnami/valkey publishes only `latest`,
# which is mutable. Renovate moves the digest (the annotation above it; labs64.io-workspace
# default.json).
image:
  # renovate-digest: datasource=docker depName=docker.io/bitnami/valkey version=latest
  digest: "sha256:dc39ba054b5d4192d3ebff4ac6643f155e656fc7809c1b2e8df86e2c0a39f204"

architecture: standalone
fullnameOverride: "redis"

auth:
  enabled: true
  password: labs64pw

primary:
  persistence:
    enabled: true
    size: 1Gi

# Only the Labs64.IO modules' namespace may connect (the chart default admits every pod of every
# namespace); each module's egress policy names the stores it actually uses.
networkPolicy:
  allowExternal: false
  addExternalClientAccess: false
  ingressNSMatchLabels:
    kubernetes.io/metadata.name: labs64io
