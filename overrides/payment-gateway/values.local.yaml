image:
  repository: localhost:5005/payment-gateway
  tag: latest
  pullPolicy: Always

gateway:
  enabled: true

networkPolicy:
  enabled: true
  toolsEgress:
    - name: postgresql
      port: 5432
    - name: redis
      port: 6379

applicationYaml:
  labs64:
    auditflow:
      enabled: true
      url: http://labs64io-auditflow:8080

# Authorization PEP -> central Cerbos PDP
env:
  - name: LABS64_AUTH_AUTHZ_MODE
    value: SHADOW
  - name: LABS64_AUTH_AUTHZ_PDPADDRESS
    value: labs64io-authz-pdp.labs64io.svc.cluster.local:3593
  - name: PAYMENT_GATEWAY_PUBLIC_BASE_URL
    value: http://gateway.localhost/payment-gateway/api/v1
