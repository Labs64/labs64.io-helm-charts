image:
  repository: localhost:5005/payment-gateway
  tag: latest
  pullPolicy: Always

gateway:
  enabled: true

networkPolicy:
  enabled: true
  toolsEgress:
    - name: postgresql
      port: 5432
    - name: redis
      port: 6379
    - name: traefik
      port: 8000
    - name: mock-oidc
      port: 8080

applicationYaml:
  labs64:
    auditflow:
      oauth2:
        token-uri: http://mock-oidc.tools.svc.cluster.local:8080/labs64io/token

# Authorization PEP -> central Cerbos PDP
env:
  - name: LABS64_AUTH_AUTHZ_MODE
    value: SHADOW
  - name: LABS64_AUTH_AUTHZ_PDPADDRESS
    value: labs64io-authz-pdp.labs64io.svc.cluster.local:3593
