# PRODUCTION EXAMPLE (BYO infrastructure) - copy and adapt; do not use as-is.
# Bundled deps stay off; point applicationYaml at your infrastructure and
# deliver credentials via secrets.data (preferably sourced through
# External Secrets Operator or your secret-management tooling).
global:
  domain: example.com
  gateway:
    # Internal platform gateway hostname for service-to-service calls.
    internalHost: gateway.infra.example.com

gateway:
  enabled: true

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true

applicationYaml:
  spring:
    datasource:
      url: jdbc:postgresql://postgres.infra.example.com:5432/payment_gateway
    data:
      redis:
        host: redis.infra.example.com
        port: "6379"
  labs64:
    auditflow:
      oauth2:
        token-uri: https://identity.infra.example.com/oauth2/token
        client-id: payment-gateway

secrets:
  data:
    AUDITFLOW_OAUTH_CLIENT_SECRET: <your-oauth-client-secret>
    SPRING_DATASOURCE_USERNAME: <your-db-username>
    SPRING_DATASOURCE_PASSWORD: <your-db-password>
    SPRING_DATA_REDIS_PASSWORD: <your-redis-password>

# RECOMMENDED for production: replace the inline secrets.data above with an
# ExternalSecret sourced from your real secret backend (AWS Secrets Manager, Vault,
# etc.) via a ClusterSecretStore you define — do not reuse the local dev
# "local-kubernetes-store" (kubernetes-provider) outside of local/CI.
# externalSecrets:
#   enabled: true
#   storeName: <your-clustersecretstore-name>
#   secretKey: <key/path in your backend containing this app's secret map>
