replicaCount: 1

image:
  repository: localhost:5005/authgateway-traefik
  tag: latest
  digest: ""
  pullPolicy: Always

# OIDC settings and the matching NetworkPolicy egress come from oidc-<provider>.local.yaml,
# selected by identityProvider in overrides/helmfile/values.local.yaml (one switch, no edits here).
networkPolicy:
  enabled: true
  # Locally only only the gateway calls it (ForwardAuth): the port is closed to every other pod. Not in the chart defaults, because
  # on AWS this chart's policy is not enabled and the deployment repository's fallback rules serve
  # it (a chart that narrows its ingress must be excluded from them, see its
  # kubernetes/network-policies/labs64io.yaml).
  ingressPorts:
    - 8081
  ingressFrom: []

logLevel: DEBUG

# Local development overrides for authgateway
rateLimit:
  average: 100
  burst: 50
