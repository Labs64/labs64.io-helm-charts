# Local identity provider, consumed by helmfile.yaml.gotmpl — the ONE switch:
#   mock     — charts/mock-oidc (default; deterministic, authenticates nobody)
#   keycloak — upstream codecentric/keycloakx + overrides/keycloak/ (real OIDC, labs64io realm with the test fixtures)
#   external — nothing installed; supply authgateway's oidc.* via overrides/authgateway/oidc-external.local.yaml
# It selects the provider release AND authgateway's OIDC values/egress together. Apply with
# `just install-tools && just install-app authgateway` (or `just deploy`).
identityProvider: mock
