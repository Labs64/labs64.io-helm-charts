image:
  repository: localhost:5005/auditflow
  tag: latest
  digest: ""

transformer:
  image:
    repository: localhost:5005/auditflow-transformer
    tag: latest
    digest: ""

sink:
  image:
    repository: localhost:5005/auditflow-sink
    tag: latest
    digest: ""

resources:
  #limits:
  #  cpu: 200m
  #  memory: 512Mi
  requests:
    cpu: 100m
    memory: 512Mi

volumes: []
 #- name: boostrapped-transformers
 #  persistentVolumeClaim:
 #    claimName: auditflow-transformer-pvc # points to AWS S3 / EFS

volumeMounts: []
 #- name: boostrapped-transformers
 #  mountPath: /transformers_bootstrap
 #  readOnly: true

env:
  - name: JAVA_OPTS
    value: "-Djavax.net.ssl.trustStore=/etc/auditflow/certs/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit"
  # Authorization PEP -> central Cerbos PDP
  - name: LABS64_AUTH_AUTHZ_MODE
    value: SHADOW
  - name: LABS64_AUTH_AUTHZ_PDPADDRESS
    value: labs64io-authz-pdp.labs64io.svc.cluster.local:3593

applicationYaml:
  transformer:
    discovery:
      mode: local # "local" or "kubernetes" — local is correct here: all 3 containers share one pod
    local:
      url: "http://localhost:8081"
    service:
      name: auditflow-transformer
      namespace: labs64io

  sink:
    discovery:
      mode: local # "local" or "kubernetes" — local is correct here: all 3 containers share one pod
    local:
      url: "http://localhost:8082"
    service:
      name: auditflow-sink
      namespace: labs64io

  # Chart default is k8s-secret (reads a per-tenant `auditflow-tenant-<id>-creds` Secret this
  # local override never creates). Local dev provisions secretRef test credentials as plain env
  # vars instead (see values.secrets.local.yaml's AUDITFLOW_TENANT_T_REGRESSION_REGRESSIONTESTKEY), so the
  # resolver must match — otherwise `secretref_present` (labs64.io-auditflow/tests/e2e/
  # secret_ref_resolution.robot) fails resolution just like `test_secretref_missing_intentional_fail`.
  secretRef:
    resolver: env

  # Legacy global pipelines stay EMPTY — a non-empty list fails startup by design.
  # Local pipelines live in the per-tenant blocks under `tenants:` below.
  auditflow:
    pipelines: []
    # Redaction is global (applies before publish, to every tenant), so this
    # rule is scoped to a field name (`extra.redact_target`) no other suite's
    # payload ever uses — enabling it here has zero effect on any other test.
    # See labs64.io-auditflow/tests/e2e/redaction.robot (item 12).
    redaction:
      enabled: true
      mask: "***"
      rules:
        - field: 'extra.redact_target'
          action: 'mask'

# Local tenant provisioning (rendered as auditflow.io/tenant ConfigMaps).
tenants:
  # Tenantless/platform events (incl. Cerbos decision audits).
  platform:
    pipelines:
      - name: 'logs'
        enabled: true
        transformer:
          name: 'zero'
        sink:
          name: 'logging_sink'
          properties:
            log-level: "DEBUG"
            format: "json"
      # Cloud pipelines disabled locally — placeholder creds cause perpetual DLQ growth
      - name: 'aws_s3'
        enabled: false
        transformer:
          name: 'zero'
        sink:
          name: 'aws_s3_sink'
          properties:
            access-key-id: "${AWS_ACCESS_KEY_ID}"
            secret-access-key: "${AWS_SECRET_ACCESS_KEY}"
            region: "us-east-1"
            bucket: "labs64-io-dev-01"
            compress: "false"
            partition-by-date: "true"
            partition-format: "year=%Y/month=%m/day=%d/"
            file-format: "json"
      - name: 'aws_cloudwatch'
        enabled: false
        condition:
          match: 'any'  # 'all' (AND) or 'any' (OR)
          rules:
            # `extra.actionStatus` is part of the optional well-known convention, not a guaranteed
            # field: `extra` is an open map and a publisher may omit it entirely. A rule on an
            # absent field simply does not match — use the `exists` operator if you need to branch
            # on presence.
            - field: 'extra.actionStatus'
              operator: 'in'
              value: 'PENDING,FAILURE,WARN,ERROR'
        transformer:
          name: 'zero'
        sink:
          name: 'aws_cloudwatch_sink'
          properties:
            access-key-id: "${AWS_ACCESS_KEY_ID}"
            secret-access-key: "${AWS_SECRET_ACCESS_KEY}"
            region: "us-east-1"
            log-group: "/labs64-io/auditflow/api.call"
            log-stream: "fedcba98-7654-3210-fedc-ba9876543210"
            create-log-group: "true"
            create-log-stream: "true"
      - name: 'webhook_site'
        enabled: false
        condition:
          match: 'all'  # 'all' (AND) or 'any' (OR)
          rules:
            - field: 'eventType'
              operator: 'eq'
              value: 'api.call'
            - field: 'sourceSystem'
              operator: 'startsWith'
              value: 'netlicensing'
        transformer:
          name: 'zero'
        sink:
          name: 'webhook_sink'
          properties:
            webhook-url: 'https://webhook.site/491e9858-1660-4cd6-8fb8-b2c4cfa637e0'
            method: 'POST'
            content-type: 'application/json'
            timeout: 30
            verify-ssl: true
            retry-count: 3
      - name: 'loki'
        enabled: false
        transformer:
          name: 'audit_loki'
        sink:
          name: 'loki_sink'
          properties:
            service-url: "https://logs-prod-012.grafana.net"
            service-path: "/loki/api/v1/push"
            username: "1314691"
            password: "${GRAFANA_PASSWORD}"
  additional:
    # Every mock-oidc token carries tenant t_mock — provision it so gateway e2e/regression
    # publishes (labs64.io-tests) keep flowing with the ingest gate active.
    - tenantId: t_mock
      enabled: true
      pipelines:
        - name: 'mock-logging'
          enabled: true
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
    # Dedicated regression-test tenant (item 12): pipeline routing, condition
    # operators, and secretRef resolution, all observed via DLQ growth.
    #
    # DLQ semantics this fixture depends on: a DLQ entry is per EVENT, not per
    # failing pipeline — AuditService.dispatchToPipelines fans one event out to
    # every matching pipeline, and if ANY of them fails retryably the WHOLE event
    # is redelivered and (on retry exhaustion) dead-lettered ONCE, regardless of
    # how many pipelines failed on it. That is why every "probe_*" pipeline below
    # is ANDed with a unique `extra.op` (and, for probe_eq_intentional_fail/probe_any_mode_intentional_fail's
    # fan-out case, `extra.value`/`extra.op_any`) discriminator: exactly one probe
    # may match a given test event, so "this event's DLQ entry" is unambiguously
    # attributable to that one probe, and an event matching NO probe produces NO
    # DLQ entry at all (never mix in a permanently-unconditional failing pipeline
    # here — it would turn every other test's "no match" case into a false "DLQ
    # grew").
    #
    # Every probe is deliberately broken via a ${secretRef:...} that never
    # resolves (EnvSecretRefResolver throws RetryableDeliveryException
    # in-process, no network call attempted) — fast and sink-agnostic.
    # See labs64.io-auditflow/tests/e2e/{pipeline_routing,condition_operators,secret_ref_resolution}.robot.
    - tenantId: t_regression
      enabled: true
      quota:
        rateLimitPerSec: 100
        burst: 200
      pipelines:
        - name: 'probe_eq_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'eq'
              - field: 'extra.value'
                operator: 'eq'
                value: 'target'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_neq_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'neq'
              - field: 'extra.value'
                operator: 'neq'
                value: 'control'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_contains_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'contains'
              - field: 'extra.value'
                operator: 'contains'
                value: 'needle'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_startswith_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'startswith'
              - field: 'extra.value'
                operator: 'startsWith'
                value: 'prefix'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_endswith_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'endswith'
              - field: 'extra.value'
                operator: 'endsWith'
                value: 'suffix'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_in_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'in'
              - field: 'extra.value'
                operator: 'in'
                value: 'a,b,c'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_notin_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'notin'
              - field: 'extra.value'
                operator: 'notIn'
                value: 'x,y'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_regex_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'regex'
              - field: 'extra.value'
                operator: 'regex'
                value: '^R[0-9]{3}$'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_gt_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'gt'
              - field: 'extra.value'
                operator: 'gt'
                value: '10'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_gte_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'gte'
              - field: 'extra.value'
                operator: 'gte'
                value: '10'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_lt_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'lt'
              - field: 'extra.value'
                operator: 'lt'
                value: '10'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_lte_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'lte'
              - field: 'extra.value'
                operator: 'lte'
                value: '10'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_eqignorecase_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'eqignorecase'
              - field: 'extra.value'
                operator: 'eqIgnoreCase'
                value: 'TARGET'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_exists_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'exists'
              - field: 'extra.value'
                operator: 'exists'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_notexists_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'notexists'
              - field: 'extra.value'
                operator: 'notExists'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'probe_any_mode_intentional_fail'
          enabled: true
          condition:
            match: 'any'
            rules:
              - field: 'extra.op_any'
                operator: 'eq'
                value: 'any_x'
              - field: 'extra.op_any'
                operator: 'eq'
                value: 'any_y'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
        - name: 'secretref_present'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'secretref_present'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionTestKey}"
        - name: 'test_secretref_missing_intentional_fail'
          enabled: true
          condition:
            match: 'all'
            rules:
              - field: 'extra.op'
                operator: 'eq'
                value: 'test_secretref_missing_intentional_fail'
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"
              probe-trigger: "${secretRef:regressionMissingKey}"
    # Dedicated tiny-quota tenant (item 12) so quota_enforcement.robot can trip
    # 429 TENANT_RATE_LIMITED deterministically without affecting t_mock or
    # t_regression's own generous quota.
    - tenantId: t_regression_quota
      enabled: true
      quota:
        rateLimitPerSec: 1
        burst: 2
      pipelines:
        - name: 'quota-sink'
          enabled: true
          transformer:
            name: 'zero'
          sink:
            name: 'logging_sink'
            properties:
              log-level: "DEBUG"

gateway:
  enabled: true

networkPolicy:
  enabled: true
