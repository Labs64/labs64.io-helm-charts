# Loki configuration for local development
# Single-binary mode with local filesystem storage
deploymentMode: SingleBinary
loki:
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
  auth_enabled: false
  useTestSchema: true
  commonConfig:
    replication_factor: 1
  storage:
    # MUST be set explicitly: the chart defaults to `s3`, which renders
    # common.storage.s3 and leaves common.storage.filesystem unset. Meanwhile
    # `useTestSchema: true` above pins the schema's object_store to `filesystem`, so the
    # ingester used a filesystem client with no configured directory, resolved chunk
    # paths relative to the CWD, and failed on the read-only root filesystem with:
    #   failed to flush chunks: store put chunk: mkdir fake: read-only file system
    # ("fake" is the tenant id Loki uses when auth_enabled is false.) With this set the
    # chart renders absolute chunks_directory/rules_directory under /var/loki.
    type: filesystem
    # s3-only; retained for reference but unused while type is filesystem.
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  singleBinary:
    replicas: 1
    persistence:
      enabled: false
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 512Mi
gateway:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
monitor:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
# The canary is a Loki-availability probe: it pushes synthetic heartbeat entries
# (nanosecond timestamp + `p` padding) and queries them back. It defaults to
# `enabled: true` in the chart, so it must be disabled EXPLICITLY — commenting the
# block out leaves the canary running. Note it runs with `-push=true`, writing
# straight to the Loki push API, so it bypasses the OTel Collector entirely and no
# collector-side filter can suppress it. Off locally: pure log noise in Grafana.
lokiCanary:
  enabled: false
