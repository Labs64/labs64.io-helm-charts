# Allowlist for scripts/lint-configmap-secrets.py.
#
# Every entry is an admission that a credential-shaped value renders into a
# ConfigMap. Prefer fixing the chart. Use this only for genuine false positives
# — a key whose *name* looks like a credential but whose value is not one.
#
# `match` is a glob over `<chart>/<configmap-name>/<path>`, e.g.
#   auditflow/lint-auditflow-app-ext/data.application.yaml.spring.security.token-uri
# `reason` is mandatory: state why the value is not a credential.
#
# OAuth token endpoint keys are URLs, not credentials.
allow:
  - match: "payment-gateway/lint-payment-gateway-app-ext/data.application.yaml.labs64.auditflow.oauth2.token-uri"
    reason: "OAuth2 token endpoint metadata is a public URL, not a token or credential."
  - match: "labs64io-ecosystem/lint-labs64io-ecosystem-payment-gateway-app-ext/data.application.yaml.labs64.auditflow.oauth2.token-uri"
    reason: "OAuth2 token endpoint metadata is a public URL, not a token or credential."
